# ============================================================
# Proxy Reverso Unificado
# Apps Legados (host.docker.internal) + MIS Hub (docker interno)
# Última atualização: 06/01/2026
# ============================================================

# ==============================================================================
# UPSTREAMS - APPS LEGADOS (EXTERNOS - host.docker.internal)
# ==============================================================================
upstream frontend_react_mis      { server host.docker.internal:3005; } # Frontend MIS
upstream backend_django_mis     { server host.docker.internal:8000; } # Backend MIS
upstream frontend_react_density  { server host.docker.internal:3006; } # Frontend Density App
upstream backend_flask_density  { server host.docker.internal:5001; } # Backend Density App
upstream frontend_react_predicao { server host.docker.internal:3003; } # Frontend Predict Generic
upstream backend_flask_predicao  { server host.docker.internal:5004; } # Backend Predict Generic

upstream grafana_service         { server host.docker.internal:3001; } # Grafana (TIG Stack)
upstream influxdb_service       { server host.docker.internal:8181; } # InfluxDB API (TIG Stack)
upstream nodered_service        { server host.docker.internal:1880; } # Node-RED Principal (Stack 06)
upstream nodered_embalagem     { server host.docker.internal:1884; } # Node-RED Embalagem
upstream nodered_process_paking { server host.docker.internal:1885; } # Node-RED Process Packing
# upstream backend_llm             { server host.docker.internal:8080; } # LLM (Comentado)

# ==============================================================================
# UPSTREAMS - MIS HUB (DOCKER INTERNO)
# ==============================================================================
upstream frontend_mis_core      { server frontend:80; }
upstream backend_django_core    { server django:8000; }
upstream backend_flask_core     { server flask:5000; }
upstream frontend_mis_ai        { server mis-ai-frontend:3007; }
upstream backend_mis_ai         { server mis-ai-backend:5004; }
upstream frontend_mis_energy    { server mis-energy-frontend:3008; }
upstream backend_mis_energy     { server mis-energy-backend:5005; }
upstream backend_nodered_hub    { server node-red:1880; }
upstream frontend_grafana_hub   { server grafana:3000; }
upstream chronograf_hub         { server chronograf:8888; }

server {
    listen 80;
    server_name localhost;

    # ==================== LOCATIONS ESPECÍFICAS (ORDEM IMPORTA!) ====================
    # As locations mais específicas devem vir ANTES das genéricas

    # ==============================================================================
    # ARQUIVOS ESTÁTICOS DA LANDING PAGE
    # ==============================================================================
    
    # --- Rota: Imagens e Vídeos do Hub ---
    location /imagens/ {
        alias /usr/share/nginx/html/imagens/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ==============================================================================
    # ROTAS DO MIS HUB (docker-compose interno) - NOVAS
    # ==============================================================================

    # --- Rota: MIS-Core Frontend ---
    location /mis-core/ {
        proxy_pass http://frontend_mis_core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # --- Rota: MIS-Core Django API ---
    location /mis-core-api/ {
        proxy_pass http://backend_django_core/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: MIS-Core Django Admin ---
    location /mis-core-admin/ {
        proxy_pass http://backend_django_core/mis-core-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: MIS-Core Flask API ---
    location /mis-core-flask-api/ {
        rewrite ^/mis-core-flask-api/(.*)$ /api/$1 break;
        proxy_pass http://backend_flask_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: MIS-AI Frontend ---
    location /mis-ai/ {
        proxy_pass http://frontend_mis_ai;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: MIS-AI Backend API ---
    location /mis-ai-api/ {
        proxy_pass http://backend_mis_ai/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeouts estendidos para operações de IA/ML
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # --- Rota: MIS-Energy Frontend ---
    location /mis-energy/ {
        proxy_pass http://frontend_mis_energy;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: MIS-Energy Backend API ---
    location /mis-energy-api/ {
        proxy_pass http://backend_mis_energy/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Grafana MIS Hub ---
    location /grafana-hub/ {
        proxy_pass http://frontend_grafana_hub/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Rota: Node-RED MIS Hub ---
    location /nodered-hub/ {
        proxy_pass http://backend_nodered_hub/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Chronograf MIS Hub ---
    location /chronograf-hub/ {
        # Tira o prefixo /chronograf-hub/ antes de mandar pro Chronograf
        rewrite ^/chronograf-hub/(.*)$ /$1 break;

        proxy_pass http://chronograf_hub;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # ==============================================================================
    # ROTAS LEGADAS (APPS EXTERNOS - host.docker.internal) - MANTIDAS
    # ==============================================================================

    # --- Rota: Backend MIS (Django API) ---
    location /api/ {
        proxy_pass http://backend_django_mis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: MIS Change Over Admin (Django Admin Legado) ---
    location /mis-change-over-admin/ {
        proxy_pass http://backend_django_mis/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Django Admin Legado (redirects internos) ---
    location /admin/ {
        proxy_pass http://backend_django_mis/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # --- Rota: Arquivos estáticos APENAS do Django Admin ---
    location /static/admin/ {
        proxy_pass http://backend_django_mis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Sincronizar SKUs ---
    location /sincronizar-skus/ {
        proxy_pass http://backend_django_mis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Frontend Density App ---
    location /density-app/ {
        proxy_pass http://frontend_react_density/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # --- Rota: Backend Density App (Flask API) ---
    location /density-api/ {
        rewrite ^/density-api/(.*)$ /api/$1 break;
        proxy_pass http://backend_flask_density;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Frontend Predict Generic ---
    location /prediction-app/ {
        proxy_pass http://frontend_react_predicao/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # --- Rota: Backend Predict Generic (Flask API) ---
    location /predicao-api/ {
        rewrite ^/predicao-api/(.*)$ /api/$1 break;
        proxy_pass http://backend_flask_predicao;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Grafana (TIG Stack) ---
    location /grafana/ {
        proxy_pass http://grafana_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Rota: InfluxDB API (TIG Stack) ---
    location /influxdb/ {
        proxy_pass http://influxdb_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Node-RED Principal (Stack 06) ---
    location /nodered/ {
        proxy_pass http://nodered_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Rota para Node-RED Embalagem ---
    location /nodered-embalagem/ {
        proxy_pass http://nodered_embalagem/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Rota para Node-RED Process Packing ---
    location /nodered-process-paking/ {
        proxy_pass http://nodered_process_paking/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Rota: LLM (Comentada) ---
    # location /v1/ {
    #     proxy_pass http://backend_llm;
    #     # ... headers ...
    # }

    # --- Rota: MIS Change Over Frontend (App Legado) ---
    location /mis-change-over/ {
        proxy_pass http://frontend_react_mis/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # ==================== LOCATION GENÉRICA (DEVE SER A ÚLTIMA!) ====================

    # --- Rota: Landing Page MIS Hub (Raiz) ---
    location / {
        root /usr/share/nginx/html/hub;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

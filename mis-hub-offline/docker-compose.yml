# ============================================================
# MIS Hub - Docker Compose (Pacote Offline)
# ============================================================
# Este arquivo é uma cópia otimizada para deploy offline
# Todas as imagens devem ser carregadas via 'docker load'
# IMPORTANTE: pull_policy: never garante uso apenas de imagens locais
# ============================================================

version: "3.8"

services:
  # ==========================================
  # INFRAESTRUTURA BASE
  # ==========================================

  # ===== MYSQL (COMPARTILHADO) =====
  mysql:
    image: mysql:8.0
    pull_policy: never
    container_name: mis-hub-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mis-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ===== INFLUXDB 1.8 =====
  influxdb:
    image: influxdb:1.8-alpine
    pull_policy: never
    container_name: mis-hub-influxdb
    environment:
      INFLUXDB_DB: ${INFLUXDB_DATABASE}
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      INFLUXDB_HTTP_AUTH_ENABLED: ${INFLUXDB_HTTP_AUTH_ENABLED}
      TZ: ${TZ}
    ports:
      - "${INFLUXDB_HOST_PORT:-8087}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - mis-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://localhost:8086/ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # SERVIÇOS DO MIS-CORE
  # ==========================================

  # ===== DJANGO (CORE BACKEND) =====
  django:
    image: mis-core-django:v1.3
    pull_policy: never
    container_name: mis-hub-django
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
      INFLUXDB_USER: ${INFLUXDB_USER}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${DJANGO_HOST_PORT:-8001}:8000"
    volumes:
      - django_static:/app/staticfiles
    networks:
      - mis-network
    depends_on:
      mysql:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health/" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ===== FLASK (ANALYTICS BACKEND) =====
  flask:
    image: mis-core-flask:v1.2
    pull_policy: never
    container_name: mis-hub-flask
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
      INFLUXDB_USER: ${INFLUXDB_USER}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD}
      DJANGO_HOST: django
      DJANGO_PORT: 8000
      DJANGO_API_URL: http://django:8000/api
    ports:
      - "${FLASK_HOST_PORT:-5002}:5000"
    networks:
      - mis-network
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped

  # ===== FRONTEND CORE (NGINX) =====
  frontend:
    image: mis-core-frontend:v1.6
    pull_policy: never
    container_name: mis-hub-frontend-core
    environment:
      TZ: ${TZ}
      VITE_DJANGO_API_URL: /mis-core-api
      VITE_FLASK_API_URL: /mis-core-flask-api
    ports:
      - "${FRONTEND_HOST_PORT:-81}:80"
    networks:
      - mis-network
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped

  # ===== COLETOR OPC =====
  coletor:
    image: mis-core-coletor:v1.0
    pull_policy: never
    container_name: mis-hub-coletor
    environment:
      DJANGO_API_URL: http://django:8000/api
      FLASK_API_URL: http://flask:5000/api
    networks:
      - mis-network
    restart: unless-stopped

  # ==========================================
  # SERVIÇOS DO MIS-AI
  # ==========================================

  # ===== AI BACKEND (FLASK) =====
  mis-ai-backend:
    image: mis-core-mis-ai-backend:v1.1
    pull_policy: never
    container_name: mis-hub-ai-backend
    ports:
      - "5004:5004"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/mis_ai_db
      OPC_SERVER_URL: ${OPC_SERVER_URL}
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
      INFLUXDB_USER: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      INFLUXDB_DATABASE: mis_ai_db
    networks:
      - mis-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ===== AI FRONTEND (REACT) =====
  mis-ai-frontend:
    image: mis-core-mis-ai-frontend:latest
    pull_policy: never
    container_name: mis-hub-ai-frontend
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: production
      VITE_API_URL: /mis-ai-api
    networks:
      - mis-network
    depends_on:
      - mis-ai-backend
    restart: unless-stopped

  # ==========================================
  # SERVIÇOS DO MIS-ENERGY
  # ==========================================

  # ===== ENERGY BACKEND (FLASK) =====
  mis-energy-backend:
    image: mis-core-mis-energy-backend:latest
    pull_policy: never
    container_name: mis-hub-energy-backend
    ports:
      - "5005:5005"
    environment:
      FLASK_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: mis_energy_db
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      INFLUXDB_DATABASE: mis_energy_db
    networks:
      - mis-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ===== ENERGY FRONTEND (REACT) =====
  mis-energy-frontend:
    image: mis-core-mis-energy-frontend:latest
    pull_policy: never
    container_name: mis-hub-energy-frontend
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: production
      VITE_API_URL: /mis-energy-api
    networks:
      - mis-network
    depends_on:
      - mis-energy-backend
    restart: unless-stopped

  # ===== ENERGY COLLECTOR =====
  mis-energy-collector:
    image: mis-core-mis-energy-collector:latest
    pull_policy: never
    container_name: mis-hub-energy-collector
    environment:
      BACKEND_URL: http://mis-energy-backend:5005/api
      POLL_INTERVAL: 10
    networks:
      - mis-network
    depends_on:
      - mis-energy-backend
    restart: unless-stopped

  # ==========================================
  # PROXY REVERSO (NGINX)
  # ==========================================

  nginx-proxy:
    image: mis-core-proxy:v1.0
    pull_policy: never
    container_name: mis-hub-proxy
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html/hub:ro
      - ./imagens:/usr/share/nginx/html/imagens:ro
    networks:
      - mis-network
    depends_on:
      - frontend
      - django
      - flask
      - mis-ai-backend
      - mis-ai-frontend
      - mis-energy-backend
      - mis-energy-frontend
    restart: unless-stopped

  # ==========================================
  # FERRAMENTAS AUXILIARES
  # ==========================================

  # ===== NODE-RED =====
  node-red:
    image: mis-core-node-red:latest
    pull_policy: never
    container_name: mis-hub-node-red
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - node_red_data:/data
    networks:
      - mis-network
    restart: unless-stopped

  # ===== GRAFANA =====
  grafana:
    image: grafana/grafana:latest
    pull_policy: never
    container_name: mis-hub-grafana
    environment:
      - TZ=America/Sao_Paulo
      - GF_SERVER_ROOT_URL=http://192.168.30.71:3000/grafana-hub/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3004:3000"
    networks:
      - mis-network
    restart: unless-stopped

  # ===== MOSQUITTO (MQTT) =====
  mosquitto:
    image: eclipse-mosquitto:latest
    pull_policy: never
    container_name: mis-hub-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - mis-network
    restart: unless-stopped

  # ===== CHRONOGRAF =====
  chronograf:
    image: chronograf:1.8
    pull_policy: never
    container_name: mis-hub-chronograf
    ports:
      - "8889:8888"
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_USERNAME: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      PUBLIC_URL: http://192.168.30.71:3000/chronograf-hub
    networks:
      - mis-network
    restart: unless-stopped

  # ===== KAPACITOR =====
  kapacitor:
    image: kapacitor:1.5
    pull_policy: never
    container_name: mis-hub-kapacitor
    ports:
      - "9093:9092"
    environment:
      KAPACITOR_INFLUXDB_0_URLS_0: http://influxdb:8086
      KAPACITOR_INFLUXDB_0_USERNAME: ${INFLUXDB_ADMIN_USER}
      KAPACITOR_INFLUXDB_0_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
    volumes:
      - kapacitor_data:/var/lib/kapacitor
    networks:
      - mis-network
    restart: unless-stopped

# ==========================================
# VOLUMES (Persistência de Dados)
# ==========================================
volumes:
  mysql_data:
    name: mis-hub-mysql-data
  influxdb_data:
    name: mis-hub-influxdb-data
  kapacitor_data:
    name: mis-hub-kapacitor-data
  node_red_data:
    name: mis-hub-node-red-data
  grafana_data:
    name: mis-hub-grafana-data
  mosquitto_data:
    name: mis-hub-mosquitto-data
  mosquitto_log:
    name: mis-hub-mosquitto-log
  django_static:
    name: mis-hub-django-static

# ==========================================
# REDE
# ==========================================
networks:
  mis-network:
    name: mis-hub-network
    driver: bridge

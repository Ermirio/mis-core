version: "3.8"

services:

  influxdb:
    image: influxdb:1.8
    container_name: influxdb_1_8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_HTTP_AUTH_ENABLED=true
    volumes:
      - influxdb-data:/var/lib/influxdb
      - ./influxdb-init:/docker-entrypoint-initdb.d:ro
    networks:
      - industrial-net
    restart: always

  chronograf:
    image: chronograf:1.8
    container_name: chronograf_1_8
    ports:
      - "8888:8888"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_USERNAME=admin
      - INFLUXDB_PASSWORD=admin123
    depends_on:
      - influxdb
    networks:
      - industrial-net
    restart: always

  kapacitor:
    image: kapacitor:1.5
    container_name: kapacitor_1_5
    ports:
      - "9092:9092"
    environment:
      - KAPACITOR_INFLUXDB_0_URLS=http://influxdb:8086
      - KAPACITOR_INFLUXDB_0_USERNAME=admin
      - KAPACITOR_INFLUXDB_0_PASSWORD=admin123
      - KAPACITOR_URL=http://kapacitor:9092
    volumes:
      - kapacitor-data:/var/lib/kapacitor
    depends_on:
      - influxdb
    networks:
      - industrial-net
    restart: always

volumes:
  influxdb-data:
  kapacitor-data:

networks:
  industrial-net:
    driver: bridge

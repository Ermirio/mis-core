# Nginx Configuration - MIS-Energy Frontend
# Serves the React/Vite app with SPA routing

server {
    listen 3008;
    server_name localhost;

    # Root directory
    root /usr/share/nginx/html;
    index index.html;

    # Logs
    access_log /var/log/nginx/energy-app-access.log;
    error_log /var/log/nginx/energy-app-error.log;

    # Fix: Prevent absolute redirects using internal port
    absolute_redirect off;
    port_in_redirect off;

    # Serve application at /mis-energy/
    location /mis-energy/ {
        alias /usr/share/nginx/html/energy-app/;
        try_files $uri $uri/ /energy-app/index.html;
        
        # Headers for SPA
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Serve static assets with cache
    location /mis-energy/assets/ {
        alias /usr/share/nginx/html/energy-app/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redirect root to /mis-energy/
    location = / {
        return 301 /mis-energy/;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
}

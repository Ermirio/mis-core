server {
    listen 80;
    server_name _;

    # Endereço do Servidor MIS (Ajuste o IP conforme necessário)
    set $target_server "http://192.168.15.19:3000";
    # Se usar DNS, pode colocar o nome aqui.
    
    # ATENÇÃO: Nginx Community não suporta variáveis no proxy_pass facilmente sem resolver DNS.
    # Por isso, vamos usar o valor direto ou um 'upstream' se precisar.
    
    location / {
        # IP da máquina Linux onde o MIS Core está rodando
        proxy_pass http://192.168.15.21:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Websockets (Necessário para Node-RED e Grafana)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

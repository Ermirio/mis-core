# Arquivo: proxy-reverse/nginx.conf
# Proxy Local para MIS Core (Modo Docker Network)

# Upstreams apontando para os nomes de serviço internos do Docker
# Isso evita problemas de resolução DNS do host e firewall
upstream frontend_mis_core      { server frontend:80; }
upstream backend_django_core    { server django:8000; }
upstream backend_flask_core     { server flask:5000; }

server {
    listen 80;
    server_name localhost;

    # Fix: Prevent Nginx from stripping the external port in redirects
    absolute_redirect off;
    port_in_redirect off;

    # --- Rota: Frontend (Raiz) ---
    location / {
        proxy_pass http://frontend_mis_core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # --- Rota: Django API ---
    location /api/ {
        proxy_pass http://backend_django_core/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Django Admin (Renomeada) ---
    location /mis-core-admin/ {
        proxy_pass http://backend_django_core/mis-core-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # --- Rota: Django Static ---
    location /static/ {
        proxy_pass http://backend_django_core/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Flask API (Opcional via Proxy) ---
    location /flask-api/ {
        rewrite ^/flask-api/(.*)$ /api/$1 break;
        proxy_pass http://backend_flask_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

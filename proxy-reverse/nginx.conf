# ==============================================================================
# SERVER: MIS CHANGE-OVER (changeover.mis.local)
# ==============================================================================
server {
    listen 80;
    server_name changeover.mis.local;
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ── Backend REST API (/mis-change-over-api/xxx → backend:8000/api/xxx) ──
    location ~ ^/mis-change-over-api/(.*)$ {
        set $subpath $1;
        set $upstream http://mis-changeover-backend:8000;
        proxy_pass $upstream/api/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── Django Admin ──
    location = /mis-change-over-admin { return 301 /mis-change-over-admin/; }

    location ~ ^/mis-change-over-admin/(.*)$ {
        set $subpath $1;
        set $upstream http://mis-changeover-backend:8000;
        proxy_pass $upstream/admin/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /admin/ /mis-change-over-admin/;
    }

    # ── Django Static (admin CSS/JS) ──
    location /mis-change-over-static/ {
        set $upstream http://mis-changeover-backend:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
    }

    # ── Frontend React SPA (tudo o mais) ──
    location / {
        set $upstream http://mis-changeover-frontend:80;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ==============================================================================
# SERVER: MIS CHANGE OVER (changeover.mis.local)
# ==============================================================================
server {
    listen 80;
    server_name changeover.mis.local;

    # FIX v7.0: proxy_pass sem trailing slash — mesmo motivo do bloco hub acima.
    # Com trailing slash o nginx strip o path, o frontend entrava em loop de redirect.
    #
    # ANTES (causava loop de redirect):
    # location / {
    #     proxy_pass http://frontend_mis_changeover/;
    #
    location / {
        proxy_pass http://frontend_mis_changeover;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rota de API via domínio direto (espelha /mis-change-over-api/ do hub)
    location /mis-change-over-api/ {
        proxy_pass http://backend_mis_changeover/api/;
        proxy_redirect /api/ /mis-change-over-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # API de Dados (Flask/Density) - Fallback para Host
    location /data-api/ {
        proxy_pass http://host.docker.internal:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API LLM (Llama) - Fallback para Host
    location /v1/ {
        proxy_pass http://host.docker.internal:8080/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}



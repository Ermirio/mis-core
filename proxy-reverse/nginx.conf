# Arquivo: proxy-reverse/nginx.conf
# Proxy Local para MIS Core (Modo Domain-Based Routing)

# ==============================================================================
# UPSTREAMS (Definição dos serviços internos Docker)
# ==============================================================================
upstream frontend_mis_core       { server frontend:80; }
upstream backend_django_core     { server django:8000; }
upstream backend_flask_core      { server flask:5000; }
upstream frontend_mis_ai         { server mis-ai-frontend:3007; }
upstream backend_mis_ai          { server mis-ai-backend:5004; }
upstream frontend_mis_energy     { server mis-energy-frontend:3008; }
upstream backend_mis_energy      { server mis-energy-backend:5005; }
upstream frontend_mis_changeover { server mis-changeover-frontend:80; }
upstream backend_mis_changeover  { server mis-changeover-backend:8000; }
upstream backend_nodered         { server node-red:1880; }
upstream frontend_grafana        { server grafana:3000; }
upstream backend_emqx_dashboard  { server emqx:18083; }
upstream backend_chronograf      { server chronograf:8888; }
upstream backend_portainer       { server portainer:9000; }
upstream frontend_mis_planning   { server mis-planning-frontend:80; }
upstream backend_mis_planning    { server mis-planning-backend:8000; }


# ==============================================================================
# SERVER: HUB PRINCIPAL (hub.mis.local)
# ==============================================================================
server {
    listen 80 default_server;
    server_name hub.mis.local localhost;

    # Fix: Prevent Nginx from stripping the external port in redirects
    absolute_redirect off;
    port_in_redirect off;

    # --- Landing Page (Estático) ---
    location / {
        root /usr/share/nginx/html/hub;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --- Assets Comuns ---
    location /imagens/ {
        alias /usr/share/nginx/html/imagens/;
    }

    # --- Django API ---
    location /api/ {
        proxy_pass http://backend_django_core/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django API (MIS Core Frontend - rota dedicada) ---
    location /mis-core-api/ {
        proxy_pass http://backend_django_core/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django Admin ---
    location /mis-core-admin/ {
        proxy_pass http://backend_django_core/mis-core-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django Static ---
    location /static/ {
        proxy_pass http://backend_django_core/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Legacy Flask API ---
    location /flask-api/ {
        rewrite ^/flask-api/(.*)$ /api/$1 break;
        proxy_pass http://backend_flask_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Legacy Flask API (MIS Core Frontend - rota dedicada) ---
    location /mis-core-flask-api/ {
        rewrite ^/mis-core-flask-api/(.*)$ /api/$1 break;
        proxy_pass http://backend_flask_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota para o próprio Frontend Core (React) ---
    location /mis-core/ {
        proxy_pass http://frontend_mis_core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- MIS Change Over Frontend ---
    # FIX v7.0: proxy_pass sem trailing slash para preservar o prefixo /mis-change-over/
    # ao ser passado ao frontend. Com trailing slash o nginx strip o prefixo, o frontend
    # retornava redirect 302 /mis-change-over/ → loop infinito → browser trocava para https.
    # Bloco exact-match para redirecionar URI sem barra antes do prefix-match.
    #
    # ANTES (causava loop de redirect):
    # location /mis-change-over/ {
    #     proxy_pass http://frontend_mis_changeover/;
    #
    location = /mis-change-over {
        return 301 /mis-change-over/;
    }
    location /mis-change-over/ {
        proxy_pass http://frontend_mis_changeover;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout estendido para operações longas (troca de SKU com múltiplos CLPs/tags)
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # --- MIS Change Over Backend API ---
    location /mis-change-over-api/ {
        proxy_pass http://backend_mis_changeover/api/;

        # Corrige redirects internos do Django (Trailing Slashes)
        proxy_redirect /api/ /mis-change-over-api/;
        proxy_redirect http://$host:$server_port/api/ http://$host:$server_port/mis-change-over-api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout estendido para operações longas (troca de SKU com múltiplos CLPs/tags)
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # --- MIS Change Over Data API (Flask/Density) ---
    location /mis-change-over-data-api/ {
        proxy_pass http://host.docker.internal:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- MIS Change Over Django Admin ---
    location = /mis-change-over-admin {
        return 301 /mis-change-over-admin/;
    }

    location /mis-change-over-admin/ {
        proxy_pass http://backend_mis_changeover/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";

        proxy_redirect /admin/ /mis-change-over-admin/;
        proxy_redirect / /mis-change-over-admin/;

        sub_filter 'data-href-template="/admin/' 'data-href-template="/mis-change-over-admin/';
        sub_filter '/static/' '/mis-change-over-static/';
        sub_filter 'href="/admin/' 'href="/mis-change-over-admin/';
        sub_filter 'action="/admin/' 'action="/mis-change-over-admin/';
        sub_filter 'data-ajax--url="/admin/' 'data-ajax--url="/mis-change-over-admin/';
        sub_filter 'src="/admin/' 'src="/mis-change-over-admin/';
        sub_filter 'data-popup-activation-url="/admin/' 'data-popup-activation-url="/mis-change-over-admin/';

        sub_filter_once off;
        sub_filter_types *;
    }

    # --- MIS Change Over Static Files (Django Admin CSS/JS) ---
    location /mis-change-over-static/ {
        proxy_pass http://backend_mis_changeover;
        proxy_set_header Host $host;
    }

    # --- MIS AI Frontend ---
    location /mis-ai/ {
        proxy_pass http://frontend_mis_ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- MIS AI Backend API ---
    location /mis-ai-api/ {
        proxy_pass http://backend_mis_ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- MIS Energy Frontend ---
    location /mis-energy/ {
        proxy_pass http://frontend_mis_energy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- MIS Energy Backend API ---
    location /mis-energy-api/ {
        proxy_pass http://backend_mis_energy/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Grafana ---
    location /grafana/ {
        proxy_pass http://frontend_grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /grafana/api/live/ {
        proxy_pass http://frontend_grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # --- Node-RED ---
    location /nodered/ {
        proxy_pass http://backend_nodered;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    # --- EMQX Dashboard ---
    location /emqx/ {
        proxy_pass http://backend_emqx_dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- Chronograf ---
    location /chronograf/ {
        proxy_pass http://backend_chronograf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- Portainer ---
    location /portainer/ {
        proxy_pass http://backend_portainer/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    # --- MIS Planning Frontend (React SPA) ---
    location /mis-planning/ {
        proxy_pass http://frontend_mis_planning/mis-planning/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- MIS Planning Backend API ---
    location /mis-planning-api/ {
        proxy_pass http://backend_mis_planning/api/;
        proxy_redirect /api/ /mis-planning-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- MIS Planning Django Admin ---
    location = /mis-planning-admin {
        return 301 /mis-planning-admin/;
    }

    location /mis-planning-admin/ {
        proxy_pass http://backend_mis_planning/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_redirect /admin/ /mis-planning-admin/;
        sub_filter '/static/' '/mis-planning-static/';
        sub_filter 'href="/admin/' 'href="/mis-planning-admin/';
        sub_filter 'action="/admin/' 'action="/mis-planning-admin/';
        sub_filter 'data-ajax--url="/admin/' 'data-ajax--url="/mis-planning-admin/';
        sub_filter_once off;
        sub_filter_types *;
    }

    # --- MIS Planning Static Files ---
    location /mis-planning-static/ {
        proxy_pass http://backend_mis_planning/mis-planning-static/;
        proxy_set_header Host $host;
    }
}



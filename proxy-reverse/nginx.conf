# Arquivo: proxy-reverse/nginx.conf
# Proxy Local para MIS Core (Modo Docker Network)

# Upstreams apontando para os nomes de serviço internos do Docker
# Isso evita problemas de resolução DNS do host e firewall
upstream frontend_mis_core      { server frontend:80; }
upstream backend_django_core    { server django:8000; }
upstream backend_flask_core     { server flask:5000; }
upstream frontend_mis_ai        { server mis-ai-frontend:3007; }
upstream backend_mis_ai         { server mis-ai-backend:5004; }
upstream frontend_mis_energy    { server mis-energy-frontend:3008; }
upstream backend_mis_energy     { server mis-energy-backend:5005; }
upstream backend_nodered        { server node-red:1880; }
upstream frontend_grafana       { server grafana:3000; }
upstream backend_emqx_dashboard { server emqx:18083; }

server {
    listen 80;
    server_name localhost;

    # Fix: Prevent Nginx from stripping the external port in redirects
    absolute_redirect off;
    port_in_redirect off;

    # --- Rota: HUB (Landing Page) ---
    location / {
        root /usr/share/nginx/html/hub;
        index index.html;
    }

    # --- Assets do HUB (Imagens/Vídeos) ---
    location /imagens/ {
        alias /usr/share/nginx/html/imagens/;
    }

    # --- Rota: Frontend (Subdiretório /mis-core/) ---
    location /mis-core/ {
        proxy_pass http://frontend_mis_core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # --- Rota: Django API ---
    location /api/ {
        proxy_pass http://backend_django_core/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Django Admin (Renomeada) ---
    location /mis-core-admin/ {
        proxy_pass http://backend_django_core/mis-core-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # --- Rota: Django Static ---
    location /static/ {
        proxy_pass http://backend_django_core/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Flask API (Opcional via Proxy) ---
    location /flask-api/ {
        rewrite ^/flask-api/(.*)$ /api/$1 break;
        proxy_pass http://backend_flask_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Chronograf (Admin InfluxDB) ---
    location /chronograf/ {
        proxy_pass http://mis-core-chronograf:8888/chronograf/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: MIS-AI Frontend (Predição Genérica) ---
    location /mis-ai/ {
        # Fix: Remover barra final para preservar o path /mis-ai/ no upstream
        proxy_pass http://frontend_mis_ai;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: MIS-AI Backend API ---
    location /mis-ai-api/ {
        proxy_pass http://backend_mis_ai/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: MIS-Energy Frontend (Energy Monitoring) ---
    location /mis-energy/ {
        proxy_pass http://frontend_mis_energy;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: MIS-Energy Backend API ---
    # --- Rota: MIS-Energy Backend API (Compatibility with VITE_API_URL) ---
    location /mis-energy-api/ {
        proxy_pass http://backend_mis_energy/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: MIS-Energy Backend API (Legacy path) ---
    location /mis-energy/api/ {
        proxy_pass http://backend_mis_energy/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================
    # AUXILIARY TOOLS
    # ==========================
    location /grafana/ {
        proxy_pass http://frontend_grafana/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /nodered/ {
        proxy_pass http://backend_nodered/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /emqx/ {
        proxy_pass http://backend_emqx_dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket para EMQX Dashboard
    location /mqtt {
        proxy_pass http://emqx:8083/mqtt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

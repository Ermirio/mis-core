# Arquivo: proxy-reverse/nginx.conf
# Proxy Local para MIS Core
#
# REGRAS DE ORDENAÇÃO (nginx regex — first match wins):
#   1. Exact match (=) — maior prioridade
#   2. Regex mais específica (prefixo mais longo) ANTES de regex mais genérica
#   3. proxy_pass $upstream$request_uri — passthrough (mesmo path)
#   4. proxy_pass $upstream/novo-path/$subpath — com remapeamento de path via capture group

# ==============================================================================
# SERVER: HUB PRINCIPAL (hub.mis.local / localhost:3000)
# ==============================================================================
server {
    listen 80 default_server;
    server_name hub.mis.local localhost;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    absolute_redirect off;
    port_in_redirect off;

    # ── Estáticos locais ────────────────────────────────────────────────────

    location / {
        root /usr/share/nginx/html/hub;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /imagens/ {
        alias /usr/share/nginx/html/imagens/;
    }

    # ── Django API / Admin / Static (passthrough) ────────────────────────────

    location /api/ {
        set $upstream http://django:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mis-core-admin/ {
        set $upstream http://django:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        set $upstream http://django:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Flask API (/flask-api/xxx → flask:5000/api/xxx) ─────────────────────

    location ~ ^/flask-api/(.*)$ {
        set $subpath $1;
        set $upstream http://flask:5000;
        proxy_pass $upstream/api/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/mis-core-api/(.*)$ {
        set $subpath $1;
        set $upstream http://django:8000;
        proxy_pass $upstream/api/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/mis-core-flask-api/(.*)$ {
        set $subpath $1;
        set $upstream http://flask:5000;
        proxy_pass $upstream/api/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── MIS Core Frontend (/mis-core/xxx → frontend:80/xxx) ─────────────────

    location = /mis-core { return 301 /mis-core/; }

    location ~ ^/mis-core/(.*)$ {
        set $subpath $1;
        set $upstream http://frontend:80;
        proxy_pass $upstream/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── MIS Change-Over (prefixos mais longos PRIMEIRO) ─────────────────────

    # Static files (passthrough)
    location /mis-change-over-static/ {
        set $upstream http://backend:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
    }

    # Admin (exact redirect + regex)
    location = /mis-change-over-admin { return 301 /mis-change-over-admin/; }

    location ~ ^/mis-change-over-admin/(.*)$ {
        set $subpath $1;
        set $upstream http://backend:8000;
        proxy_pass $upstream/admin/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /admin/ /mis-change-over-admin/;
        proxy_buffering on;
        proxy_set_header Accept-Encoding "";
        sub_filter 'href="/admin/' 'href="/mis-change-over-admin/';
        sub_filter 'action="/admin/' 'action="/mis-change-over-admin/';
        sub_filter 'src="/admin/' 'src="/mis-change-over-admin/';
        sub_filter_once off;
    }

    # Data API (/mis-change-over-data-api/xxx → host:5002/xxx)
    location ~ ^/mis-change-over-data-api/(.*)$ {
        set $subpath $1;
        set $upstream http://host.docker.internal:5002;
        proxy_pass $upstream/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (/mis-change-over-api/xxx → backend:8000/api/xxx) [v7.0 dev]
    location ~ ^/mis-change-over-api/(.*)$ {
        set $subpath $1;
        set $upstream http://backend:8000;
        proxy_pass $upstream/api/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Frontend (/mis-change-over/xxx → frontend:80/mis-change-over/xxx) — passthrough
    # O nginx do frontend v7.0 já trata o prefixo /mis-change-over/ nativamente.
    location = /mis-change-over { return 301 /mis-change-over/; }

    location /mis-change-over/ {
        set $upstream http://frontend:80;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── MIS AI (api antes do frontend) ──────────────────────────────────────

    location ~ ^/mis-ai-api/(.*)$ {
        set $subpath $1;
        set $upstream http://mis-ai-backend:5004;
        proxy_pass $upstream/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mis-ai { return 301 /mis-ai/; }

    location ~ ^/mis-ai/(.*)$ {
        set $subpath $1;
        set $upstream http://mis-ai-frontend:3007;
        proxy_pass $upstream/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── MIS Energy (api antes do frontend) ──────────────────────────────────

    location ~ ^/mis-energy-api/(.*)$ {
        set $subpath $1;
        set $upstream http://mis-energy-backend:5005;
        proxy_pass $upstream/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mis-energy { return 301 /mis-energy/; }

    location ~ ^/mis-energy/(.*)$ {
        set $subpath $1;
        set $upstream http://mis-energy-frontend:80;
        proxy_pass $upstream/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Ferramentas (passthrough ou com strip de prefixo) ───────────────────

    location /grafana/ {
        set $upstream http://grafana:3000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/api/live/ {
        set $upstream http://grafana:3000;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /nodered/ {
        set $upstream http://node-red:1880;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/emqx/(.*)$ {
        set $subpath $1;
        set $upstream http://emqx:18083;
        proxy_pass $upstream/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chronograf/ {
        set $upstream http://chronograf:8888;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/portainer/(.*)$ {
        set $subpath $1;
        set $upstream http://portainer:9000;
        proxy_pass $upstream/$subpath$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


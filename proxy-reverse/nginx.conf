resolver 127.0.0.11 valid=10s ipv6=off;

# Map para WS upgrade — necessário pelo Recipe Monitor (FastAPI WebSocket).
# Quando Upgrade ausente, Connection vira "close" (HTTP keep-alive normal).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name localhost;

    absolute_redirect off;
    port_in_redirect off;

    # Redireciona raiz para o app
    location = / {
        return 301 /mis-core/;
    }

    # FastAPI v2 — prefixo mais longo, deve vir antes de /api/
    location /api/v2/ {
        set $upstream http://fastapi:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Django API
    location /api/ {
        set $upstream http://django:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Flask API
    location /flask-api/ {
        set $upstream http://flask:5000;
        rewrite ^/flask-api/(.*)$ /api/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django Admin
    location /mis-core-admin/ {
        set $upstream http://django:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Static
    location /static/ {
        set $upstream http://django:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React MIS Core
    location /mis-core/ {
        set $upstream http://frontend:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ────────────────────────────────────────────────────────────────
    # Recipe Monitor (mis-recipe-intelligent) — WS + REST
    # ────────────────────────────────────────────────────────────────
    # WebSocket primeiro (location mais específico vence). O Upgrade
    # depende dos headers definidos abaixo.
    location /recipe-monitor/ws/ {
        set $upstream http://mis-recipe-monitor:8100;
        rewrite ^/recipe-monitor/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # WS são conexões longas — desabilita timeouts agressivos
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST (GET /linhas/.../config, /snapshot, POST /sincronizar, GET /health)
    location /recipe-monitor/ {
        set $upstream http://mis-recipe-monitor:8100;
        rewrite ^/recipe-monitor/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

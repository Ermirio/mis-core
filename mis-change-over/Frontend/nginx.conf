# DNS interno do Docker — necessário para resolver mis-recipe-monitor dinamicamente.
# Sem isso, se o container do recipe-monitor reiniciar com novo IP, o nginx
# do frontend continua tentando o IP antigo até reiniciar também.
resolver 127.0.0.11 valid=10s ipv6=off;

# Map para WebSocket upgrade do Recipe Monitor.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    index index.html index.htm;

    # Garante que redirects internos sejam relativos (preserva porta no cliente)
    absolute_redirect off;

    # Redirecionar raiz para /mis-change-over/
    location = / {
        return 302 /mis-change-over/;
    }

    # Servir a aplicacao React sob o prefixo /mis-change-over/
    location /mis-change-over/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /mis-change-over/index.html;
    }

    # ─────────────────────────────────────────────────────────────
    # Recipe Monitor (mis-recipe-intelligent) — proxy embutido
    # ─────────────────────────────────────────────────────────────
    # O frontend consome /recipe-monitor/* em caminho relativo (mesmo host
    # e porta do React), evitando CORS e mantendo o JWT cookie. O nginx
    # encaminha para o container interno mis-recipe-monitor:8100.
    #
    # IMPORTANTE: o container do frontend e o do recipe-monitor precisam
    # estar na mesma network Docker (app_network).

    # WebSocket (location mais específico vence)
    location /recipe-monitor/ws/ {
        set $rm_upstream http://mis-recipe-monitor:8100;
        rewrite ^/recipe-monitor/(.*)$ /$1 break;
        proxy_pass $rm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST (/health, /linhas/.../config, /snapshot, /sincronizar, /docs, /openapi.json)
    location /recipe-monitor/ {
        set $rm_upstream http://mis-recipe-monitor:8100;
        rewrite ^/recipe-monitor/(.*)$ /$1 break;
        proxy_pass $rm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
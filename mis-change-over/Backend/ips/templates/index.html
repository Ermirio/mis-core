<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linhas Disponíveis</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link href="{% static 'ips\static\css\custom.css' %}" rel="stylesheet">
    
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Linhas Disponíveis</h1>
        <div class="row mt-4">
            <!-- Botões para as linhas -->
            {% for i in linhas %}
            <div class="col-2 mb-3">
                <button class="btn btn-primary w-100 linha-btn" data-linha="L{{ i }}">L{{ i }}</button>
            </div>
            {% endfor %}
        </div>
    </div>

   

    <!-- Bootstrap JS -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script>
        // Exemplo de script para capturar o clique dos botões e mostrar informações da linha
        document.querySelectorAll('.linha-btn').forEach(button => {
            button.addEventListener('click', function () {
                const linha = this.getAttribute('data-linha');
                alert(`Você clicou na linha: ${linha}`);
                // Aqui você pode implementar a lógica para buscar informações da linha
            });
        });
    </script>

    
</body>
</html>

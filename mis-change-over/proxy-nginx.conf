# ==============================================================================
# Upstreams (DNS interno do Docker)
# ==============================================================================
upstream frontend_react_mis  { server frontend:80; }   # Frontend MIS (React)
upstream backend_django_mis  { server backend:8000; }  # Backend MIS (Django)

server {
    listen 80;
    server_name localhost;

    # --- Rota: API Django (Principal) ---
    # Cobre: /api/linhas-disponiveis/, /api/health/, /api/linha/L01, /api/token/refresh/, etc.
    location /api/ {
        proxy_pass http://backend_django_mis/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Trocar SKU ---
    location /trocar_sku/ {
        proxy_pass http://backend_django_mis/trocar_sku/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout estendido para operações longas (múltiplos CLPs/tags)
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # --- Rota: MIS Change Over Admin (Django Admin Legado) ---
    location /mis-change-over-admin/ {
        proxy_pass http://backend_django_mis/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Django Admin Legado (redirects internos) ---
    location /admin/ {
        proxy_pass http://backend_django_mis/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # --- Rota: Arquivos estáticos APENAS do Django Admin ---
    location /mis-change-over-static/ {
        proxy_pass http://backend_django_mis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Sincronizar SKUs ---
    location /sincronizar-skus/ {
        proxy_pass http://backend_django_mis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: MIS Change Over Frontend (App Legado) ---
    location /mis-change-over/ {
        proxy_pass http://frontend_react_mis/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # --- Hub estático ---
    location / {
        root /usr/share/nginx/html/hub;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS — resolve upstreams at request time, not at startup.
    # Evita "host not found in upstream" quando django/fastapi/ferramentas sobem depois.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Preserva a porta original do cliente nos redirects (ex: :8080).
    # Sem isso o "return 301 /mis-core/" gerava Location: http://localhost/mis-core/
    # perdendo a porta e quebrando o acesso standalone.
    absolute_redirect off;
    port_in_redirect   on;

    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/x-javascript application/xml+rss
        application/json application/javascript
        image/svg+xml;

    # =========================================================================
    # Endpoint de versão — sempre dinâmico, nunca cacheado.
    # Conteúdo gerado em runtime pelo docker-entrypoint.sh a partir das ENV
    # vars MIS_VERSION / MIS_GIT_HASH / MIS_BUILD_TIME que vêm do compose.
    # =========================================================================
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /version.json =404;
    }
    location = /mis-core/version.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /version.json =404;
    }

    # =========================================================================
    # CACHE STRATEGY (IMPORTANTE):
    #   - Assets com hash em nome (Vite gera ex: index-Bv4xyz.js) -> 1 ano, immutable
    #   - HTML / JSON de config -> NUNCA cachear (no-store)
    #   - env-config.js gerado em runtime -> NUNCA cachear
    #
    # Sem isso, um navegador (ou um proxy reverso pai) que cache o index.html
    # antigo continua servindo a versão velha apesar de a imagem nova rodar.
    # =========================================================================

    # Assets versionados (com hash no nome) — cache forte é seguro
    location ~* /assets/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # env-config.js é injetado em runtime pelo entrypoint -> nunca cachear
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /env-config.js =404;
    }
    location = /mis-core/env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /env-config.js =404;
    }

    # Health check
    location = /health {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Redireciona raiz para o base path do app
    location = / {
        return 301 /mis-core/;
    }

    # Sessão obrigatória no frontend. A página de login é a única rota pública
    # do SPA; todo o restante do MIS Core é liberado somente após o Django
    # validar o cookie JWT e a política de expiração do usuário.
    location = /_mis_auth_session {
        internal;
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream/api/auth/me/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $http_host;
    }

    location = /mis-core/login {
        if ($arg_next = "") {
            return 302 /mis-core/login?next=/mis-core/;
        }
        try_files /mis-core/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Recursos necessários para renderizar a própria tela pública de login.
    location /mis-core/assets/ {
        try_files $uri =404;
    }

    location = /mis-core/intro.mp4 {
        try_files $uri =404;
    }

    location @mis_core_login {
        return 302 /mis-core/login?next=$request_uri;
    }

    location /mis-core/ {
        auth_request /_mis_auth_session;
        error_page 401 403 = @mis_core_login;
        try_files $uri $uri/ /mis-core/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # SPA routing — index.html jamais cacheado
    # try_files cai em /mis-core/index.html como fallback (vide ln -s no Dockerfile)
    location / {
        try_files $uri $uri/ /mis-core/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # Defesa contra hub proxy que tenta cachear:
        add_header X-MIS-Frontend "$upstream_addr" always;
    }

    # =========================================================================
    # Proxy para APIs — modo standalone (sem hub proxy-reverse na frente).
    #
    # O React é buildado com paths relativos que o hub proxy já conhece:
    #   VITE_DJANGO_API_URL  = /api       (hub: /api/ → django:8000)
    #   VITE_FLASK_API_URL   = /api       (nome legado da variavel; upstream e Django)
    #   VITE_FASTAPI_V2_URL  = /api/v2    (hub: /api/v2/ → fastapi:8000)
    #
    # Em modo standalone (docker compose up sem hub) este nginx é o único
    # gateway, portanto precisa dos mesmos caminhos.
    # Nginx usa prefixo mais longo: /api/v2/ vence sobre /api/.
    # =========================================================================

    location /api/ {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Não cachear respostas de API
        add_header Cache-Control "no-store" always;
    }

    # Fonte única de autorização para todas as ferramentas administrativas.
    # O Django valida o JWT HttpOnly, expiração e papel staff/superuser.
    location = /_mis_auth_admin_tools {
        internal;
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream/api/auth/admin-tools/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $http_host;
    }

    # O Portainer usa o próprio Bearer token depois do login. O subrequest
    # administrativo deve validar somente o JWT HttpOnly do MIS; encaminhar o
    # Bearer do Portainer ao Django faz os dois tokens colidirem e gera 401.
    location = /_mis_auth_admin_tools_cookie {
        internal;
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream/api/auth/admin-tools/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $http_host;
    }

    # Kepserver Manager: aplicação isolada na mesma rede Docker. A ferramenta
    # só é divulgada para superusers e o gateway repete essa autorização no
    # acesso direto. O aplicativo mantém sua própria trilha de auditoria.
    location = /kepserver-manager {
        return 301 /kepserver-manager/;
    }

    location @kepserver_login {
        return 302 /mis-core/login?next=/kepserver-manager/;
    }

    # O HTML da ferramenta continua protegido pela sessão administrativa do
    # MIS Core. Depois que a aplicação abre, porém, sua API usa o JWT próprio
    # do Kepserver Manager para aplicar os papéis viewer/editor/admin e manter
    # a trilha de auditoria. Repetir auth_request aqui interceptava inclusive
    # /api/auth/login e impedia o frontend de carregar canais após o login.
    location ^~ /kepserver-manager/api/ {
        set $kepserver_manager_upstream http://mis-kepserver-manager:8080;
        rewrite ^/kepserver-manager/(.*)$ /$1 break;
        proxy_pass $kepserver_manager_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /kepserver-manager;
        add_header Cache-Control "no-store" always;
    }

    # ^~ garante que assets internos da ferramenta nao sejam capturados pela
    # regex global de /assets/ acima antes de chegarem ao proxy.
    location ^~ /kepserver-manager/ {
        auth_request /_mis_auth_admin_tools;
        error_page 401 = @kepserver_login;
        set $kepserver_manager_upstream http://mis-kepserver-manager:8080;
        rewrite ^/kepserver-manager/(.*)$ /$1 break;
        proxy_pass $kepserver_manager_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /kepserver-manager;
        proxy_redirect / /kepserver-manager/;
        add_header Cache-Control "no-store" always;
    }

    # Admin do Django também passa por aqui (vide urls.py: /mis-core-admin/)
    location /mis-core-admin/ {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # CSRF do admin precisa do Origin original
        proxy_set_header Origin $http_origin;
    }

    # Static do Django (admin css, etc) — servido pelo gunicorn/whitenoise
    location /static/ {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Static do Django pode ser cached (whitenoise serve com hash)
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Flask-out completo: location /flask-api/ removido. Tudo agora vai
    # direto para /api/ (Django). Mantemos um rewrite passivo de
    # /flask-api/* -> /api/* para qualquer bookmark/import legado bater
    # certo - mas o upstream é o mesmo do Django.
    location /flask-api/ {
        rewrite ^/flask-api/(.*)$ /api/$1 last;
    }

    # =========================================================================
    # Ferramentas auxiliares (Grafana, Chronograf, Node-RED, EMQX dashboard).
    # Antes ficavam fora do nginx; agora proxy aqui para que os links da
    # sidebar /grafana/, /chronograf/, /nodered/ funcionem direto.
    # =========================================================================
    location /grafana/ {
        auth_request /_mis_auth_admin_tools;
        set $grafana_upstream http://mis-core-grafana:3000;
        proxy_pass $grafana_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # WebSocket (Grafana Live)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Grafana precisa saber que está sob /grafana/
        proxy_set_header X-Forwarded-Prefix /grafana;
    }

    location /grafana/api/live/ {
        set $grafana_upstream http://mis-core-grafana:3000;
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
    }

    location /chronograf/ {
        auth_request /_mis_auth_admin_tools;
        set $chronograf_upstream http://mis-core-chronograf:8888;
        proxy_pass $chronograf_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Chronograf usa --basepath, mas como o container atual está sem,
        # rewrite remove o prefixo /chronograf/ antes de proxy.
        rewrite ^/chronograf/(.*)$ /$1 break;
    }

    # =========================================================================
    # NODE-RED — controle de acesso via permissão Django.
    #
    # Toda requisição para /nodered/* passa por uma sub-request a
    # /api/auth/check-nodered/ que valida sessão + permissão
    # `equipamentos.access_nodered` (gerenciada no admin Django).
    #
    # Resultado:
    #   - usuário sem sessão  → 401 → redirect para /mis-core-admin/login/
    #   - usuário sem permissão → 403 → tela "Sem permissão" amigável
    #   - usuário autorizado  → request prossegue com header X-MIS-Authorized
    #
    # Node-RED não fica exposto publicamente (porta 1880 só na rede interna).
    # =========================================================================
    location = /_auth/nodered {
        internal;
        proxy_pass http://django:8000/api/auth/admin-tools/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        # Reencaminha o cookie de sessão para o Django reconhecer o usuário
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $http_host;
    }

    # Tela elegante quando o usuário está logado mas SEM permissão (403)
    location = /nodered-acesso-negado {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Node-RED · sem acesso</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:linear-gradient(135deg,#f7f8fa 0%,#eaeef2 100%);color:#212121;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}.card{background:#fff;border:1px solid #cfd8dc;border-radius:12px;padding:40px 44px;max-width:540px;width:100%;box-shadow:0 12px 32px rgba(15,30,55,.10),0 2px 6px rgba(15,30,55,.06)}.icon{width:56px;height:56px;border-radius:50%;background:#fbe9c8;color:#a06200;display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:28px}h1{margin:0 0 6px;font-size:20px;color:#212121;font-weight:600;letter-spacing:-.2px}.sub{font-size:13px;color:#657384;margin:0 0 20px;line-height:1.5}.box{background:#f7f8fa;border:1px solid #eef0f3;border-radius:8px;padding:14px 16px;margin:14px 0;font-size:13px;line-height:1.6;color:#3a4756}.box strong{color:#212121}code{background:#fff;border:1px solid #d8dee5;padding:2px 7px;border-radius:4px;font-size:12px;font-family:"SF Mono",ui-monospace,monospace;color:#7c4a04}.steps{margin:14px 0;padding:0;list-style:none;counter-reset:s}.steps li{counter-increment:s;padding:8px 0 8px 32px;position:relative;font-size:13px;color:#3a4756;line-height:1.5}.steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:22px;height:22px;border-radius:50%;background:#1565c0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}.actions{display:flex;gap:8px;margin-top:24px}.btn{padding:9px 18px;border-radius:6px;font-size:13px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;cursor:pointer;transition:transform .1s,box-shadow .1s}.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(15,30,55,.08)}.btn--primary{background:#1565c0;color:#fff}.btn--secondary{background:#fff;color:#3a4756;border-color:#cfd8dc}</style></head><body><div class="card"><div class="icon">🔒</div><h1>Você não tem acesso ao Node-RED</h1><p class="sub">Esta ferramenta é restrita — o coordenador precisa liberar sua conta antes do uso.</p><div class="box"><strong>O que pedir ao administrador:</strong><br>Conceder a permissão <code>access_nodered</code> à sua conta.</div><div class="box"><strong>Como o admin faz isso:</strong><ul class="steps"><li>Abre o <strong>Admin Django</strong></li><li>Navega em <strong>Usuários</strong> e clica no seu nome</li><li>Em <strong>Permissões de usuário</strong>, busca por <strong>"Pode acessar Node-RED"</strong> e adiciona à lista da direita</li><li>Salva — pronto, basta você atualizar a página</li></ul></div><div class="actions"><a class="btn btn--primary" href="/mis-core/">← Voltar ao MIS Core</a><a class="btn btn--secondary" href="/mis-core-admin/" target="_blank" rel="noopener">Abrir admin</a></div></div></body></html>';
    }

    # Tela elegante quando o usuário NÃO está logado (401)
    location = /nodered-precisa-login {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Node-RED · entrar</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:linear-gradient(135deg,#f7f8fa 0%,#eaeef2 100%);color:#212121;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}.card{background:#fff;border:1px solid #cfd8dc;border-radius:12px;padding:40px 44px;max-width:480px;width:100%;text-align:center;box-shadow:0 12px 32px rgba(15,30,55,.10),0 2px 6px rgba(15,30,55,.06)}.icon{width:56px;height:56px;border-radius:50%;background:#e3f2fd;color:#1565c0;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}h1{margin:0 0 8px;font-size:20px;color:#212121;font-weight:600}.sub{font-size:14px;color:#657384;margin:0 0 28px;line-height:1.5}.btn{padding:11px 22px;border-radius:6px;font-size:13px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:#1565c0;color:#fff;border:none;transition:transform .1s,box-shadow .1s}.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(21,101,192,.3)}.foot{margin-top:18px;font-size:12px;color:#657384}.foot a{color:#1565c0;text-decoration:none}</style></head><body><div class="card"><div class="icon">🔑</div><h1>Você precisa entrar para acessar o Node-RED</h1><p class="sub">Faça login com sua conta do MIS Core para continuar.</p><a class="btn" href="/mis-core-admin/login/?next=/nodered/">Entrar →</a><p class="foot"><a href="/mis-core/">← Voltar ao MIS Core</a></p></div></body></html>';
    }

    # Mirror endpoint — captura cada POST /flows do Node-RED em paralelo
    # ao proxy real e encaminha para o Django, que cria um snapshot do
    # versionamento. Roda async — se Django cair, Node-RED continua OK.
    # O Django filtra pelo header X-Original-URI: só processa quando o
    # request original era POST /nodered/flows.
    location = /_mirror/nodered-deploy {
        internal;
        proxy_pass http://django:8000/api/nodered/snapshot/;
        proxy_pass_request_body on;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header X-MIS-User $mis_user;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Host $http_host;
        # Curto timeout — não queremos segurar o deploy se Django demora.
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location /nodered/ {
        # Valida sessão+permissão e captura o username Django.
        auth_request /_auth/nodered;
        auth_request_set $mis_user $upstream_http_x_mis_user;
        error_page 401 = /nodered-precisa-login;
        error_page 403 = /nodered-acesso-negado;
        error_page 502 503 504 = /nodered-fora-do-ar;

        # Mirror dispara em paralelo — capturamos TODOS os requests aqui,
        # mas o endpoint Django só processa quando é um POST /flows com
        # corpo válido (validação por content-type/método interna).
        mirror /_mirror/nodered-deploy;
        mirror_request_body on;

        # Resolução TARDIA do hostname via $variable + resolver DNS interno
        # do Docker (127.0.0.11). Sem variável, o nginx resolveria
        # `mis-core-nodered` na inicialização e abortaria o startup inteiro
        # se o container não existisse — derrubando o MIS Core completo só
        # porque uma ferramenta auxiliar está fora. Com `set`, falha apenas
        # esta location (502/503 → tela "fora do ar" amigável abaixo).
        #
        # IMPORTANTE: NÃO faça rewrite stripando `/nodered/`. O Node-RED
        # está configurado com `httpAdminRoot: '/nodered'` (settings.js)
        # e ESPERA receber o prefixo. Sem o prefixo, devolve 404 para
        # tudo — o navegador vê a tela vazia / 'Cannot GET /' do express.
        # Com `proxy_pass $variable` (sem URI), o nginx anexa o request
        # URI original ao upstream — exatamente o que queremos.
        set $nodered_upstream http://mis-core-nodered:1880;
        proxy_pass $nodered_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Marcador "passei pelo gateway" + identificação do autor.
        proxy_set_header X-MIS-Authorized "1";
        proxy_set_header X-MIS-User $mis_user;
        # Node-RED usa WebSocket para o editor em tempo real.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Editor de fluxos faz uploads/exportações; aumentar limites.
        client_max_body_size 50m;
        proxy_read_timeout 300s;
    }

    # Rotas canônicas exibidas pela sidebar e utilizadas pelo Hub. Todas
    # terminam no mesmo gateway, sem exceção por hostname ou rede OT.
    location /mc-grafana/ {
        auth_request /_mis_auth_admin_tools;
        set $grafana_upstream http://mis-core-grafana:3000;
        rewrite ^/mc-grafana/(.*)$ /$1 break;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Prefix /mc-grafana;
        proxy_redirect / /mc-grafana/;
    }

    location /mc-chronograf/ {
        auth_request /_mis_auth_admin_tools;
        set $chronograf_upstream http://mis-core-chronograf:8888;
        rewrite ^/mc-chronograf/(.*)$ /$1 break;
        proxy_pass $chronograf_upstream;
        proxy_set_header Host $http_host;
        proxy_redirect / /mc-chronograf/;
    }

    location /mc-emqx/ {
        auth_request /_mis_auth_admin_tools;
        set $emqx_upstream http://mis-core-emqx:18083;
        rewrite ^/mc-emqx/(.*)$ /$1 break;
        proxy_pass $emqx_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_redirect / /mc-emqx/;
    }

    location /mc-nodered/ {
        rewrite ^/mc-nodered/(.*)$ /nodered/$1 last;
    }

    # Tela elegante quando o container Node-RED não está rodando.
    # Aparece em deploys que não incluem o container (ex.: rede OT enxuta).
    location = /nodered-fora-do-ar {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Node-RED · fora do ar</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:linear-gradient(135deg,#f7f8fa 0%,#eaeef2 100%);color:#212121;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}.card{background:#fff;border:1px solid #cfd8dc;border-radius:12px;padding:40px 44px;max-width:520px;width:100%;box-shadow:0 12px 32px rgba(15,30,55,.10),0 2px 6px rgba(15,30,55,.06)}.icon{width:56px;height:56px;border-radius:50%;background:#f4dad6;color:#b53a2b;display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:28px}h1{margin:0 0 6px;font-size:20px;color:#212121;font-weight:600}.sub{font-size:13px;color:#657384;margin:0 0 16px;line-height:1.5}.box{background:#f7f8fa;border:1px solid #eef0f3;border-radius:8px;padding:12px 14px;margin:10px 0;font-size:12px;line-height:1.6;color:#3a4756}.box code{background:#fff;border:1px solid #d8dee5;padding:1px 6px;border-radius:3px;font-size:11px;font-family:"SF Mono",ui-monospace,monospace;color:#7c4a04}.btn{padding:9px 18px;border-radius:6px;font-size:13px;font-weight:500;text-decoration:none;background:#1565c0;color:#fff;display:inline-block;margin-top:12px}</style></head><body><div class="card"><div class="icon">⚠️</div><h1>Node-RED está fora do ar</h1><p class="sub">O container <code style="font-family:monospace;background:#f0f2f5;padding:1px 5px;border-radius:3px;">mis-core-nodered</code> não respondeu. O resto do MIS Core continua funcionando normalmente.</p><div class="box"><strong>Possíveis causas:</strong><br>• Container ainda subindo (aguarde 30s e tente novamente)<br>• Imagem <code>mis-core-nodered:&lt;MIS_VERSION&gt;</code> não foi carregada no deploy<br>• Falha de rede entre o frontend e o serviço</div><div class="box"><strong>Para o administrador:</strong><br>Verifique com <code>docker compose ps node-red</code> no servidor.</div><a class="btn" href="/mis-core/">← Voltar ao MIS Core</a></div></body></html>';
    }

    # =========================================================================
    # PORTAINER - acesso pelo Hub com autenticacao nativa do Portainer.
    # O container nao publica portas no host; o nginx apenas encaminha o path.
    # Nao depende de sessao, cookie ou disponibilidade do Django.
    # =========================================================================
    location = /mc-portainer {
        return 301 /mc-portainer/;
    }

    location = /portainer-fora-do-ar {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Portainer - fora do ar</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f3f5f7;color:#20262e;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}.panel{background:#fff;border:1px solid #d8dee5;border-radius:8px;padding:32px;max-width:520px;width:100%}h1{font-size:20px;margin:0 0 10px}p{color:#596675;line-height:1.5}code{background:#eef1f4;padding:2px 6px;border-radius:3px}</style></head><body><main class="panel"><h1>Portainer esta fora do ar</h1><p>Verifique o servico com <code>docker compose ps portainer</code>.</p></main></body></html>';
    }

    location /mc-portainer/ {
        auth_request /_mis_auth_admin_tools_cookie;
        error_page 502 503 504 = /portainer-fora-do-ar;

        set $portainer_upstream http://mis-core-portainer:9000;
        # --base-url faz o Portainer gerar links /mc-portainer/*, enquanto o
        # servidor HTTP interno continua atendendo na raiz.
        rewrite ^/mc-portainer/(.*)$ /$1 break;
        proxy_pass $portainer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /mc-portainer;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
        client_max_body_size 100m;
        proxy_read_timeout 300s;
    }

    # =========================================================================
    # FastAPI v2 (analytics e producao).
    # =========================================================================
    location /api/v2/ {
        set $fastapi_upstream http://fastapi:8000;
        proxy_pass $fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        add_header Cache-Control "no-store" always;
    }
}

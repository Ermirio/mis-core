version: "3.8"

services:
  # ==========================================
  # SERVIÇOS DO MIS-CORE (Django/Infra)
  # ==========================================

  # ===== MYSQL (COMPARTILHADO) =====
  mysql:
    image: mysql:8.0
    container_name: mis-hub-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - mis-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ===== INFLUXDB 1.8 =====
  influxdb:
    image: influxdb:1.8-alpine
    container_name: mis-core-influxdb
    environment:
      INFLUXDB_DB: ${INFLUXDB_DATABASE}
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      INFLUXDB_HTTP_AUTH_ENABLED: ${INFLUXDB_HTTP_AUTH_ENABLED}
      TZ: ${TZ}
    ports:
      - "${INFLUXDB_HOST_PORT}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - mis-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://localhost:8086/ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ===== DJANGO (CORE BACKEND) =====
  django:
    image: mis-core-django:v1.0
    build:
      context: ./mis-core/backend-django
      dockerfile: Dockerfile
    container_name: mis-core-django
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
      INFLUXDB_USER: ${INFLUXDB_USER}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${DJANGO_HOST_PORT}:8000"
    volumes:
      - ./mis-core/backend-django:/app
      - django_static:/app/staticfiles
    networks:
      - mis-network
    depends_on:
      mysql:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health/" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ===== FRONTEND CORE (NGINX) =====
  frontend:
    image: mis-core-frontend:v1.0
    build:
      context: ./mis-core/frontend-react
      dockerfile: Dockerfile
      args:
        VITE_DJANGO_API_URL: ${VITE_DJANGO_API_URL}
        VITE_FLASK_API_URL: ${VITE_FLASK_API_URL}
        VITE_APP_LOGO: ${VITE_APP_LOGO}
        VITE_APP_TITLE: ${VITE_APP_TITLE}
    container_name: mis-core-frontend
    environment:
      TZ: ${TZ}
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    networks:
      - mis-network
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped

  # ===== PROXY REVERSO =====
  nginx-proxy:
    image: mis-core-proxy:v1.0
    build:
      context: ./proxy-reverse
      dockerfile: Dockerfile
    container_name: mis-core-proxy
    ports:
      - "3000:80"
    networks:
      - mis-network
    volumes:
      - ./proxy-reverse/html:/usr/share/nginx/html/hub
      - ./proxy-reverse/imagens:/usr/share/nginx/html/imagens
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # SERVIÇOS DO MIS-AI (Predict-Generic)
  # ==========================================

  # ===== AI BACKEND (FLASK) =====
  mis-ai-backend:
    build:
      context: ./mis-ai/backend
    container_name: mis-ai-backend
    ports:
      - "5004:5004"
    environment:
      # Conecta no MySQL Compartilhado (Service: mysql)
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/density_db
      OPC_SERVER_URL: ${OPC_SERVER_URL}
    networks:
      - mis-network
    volumes:
      - ./mis-ai/backend/models:/app/models
      - ./mis-ai/backend/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ===== AI FRONTEND (REACT) =====
  mis-ai-frontend:
    build:
      context: ./mis-ai/frontend
    container_name: mis-ai-frontend
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: production
      VITE_API_URL: /mis-ai-api
    networks:
      - mis-network
    depends_on:
      - mis-ai-backend
    restart: unless-stopped

  # ==========================================
  # SERVIÇOS DO MIS-ENERGY (Energy Monitoring)
  # ==========================================

  # ===== ENERGY BACKEND (FLASK) =====
  mis-energy-backend:
    build:
      context: ./mis-energy/backend
    container_name: mis-energy-backend
    ports:
      - "5005:5005"
    environment:
      FLASK_ENV: production
      # MySQL configuration (read by src/config.py)
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: energy_monitor
      # InfluxDB configuration
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      INFLUXDB_DATABASE: industrial_db
    networks:
      - mis-network
    volumes:
      - ./mis-energy/backend/database:/app/database
      - ./mis-energy/backend/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ===== ENERGY FRONTEND (REACT) =====
  mis-energy-frontend:
    build:
      context: ./mis-energy/frontend
    container_name: mis-energy-frontend
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: production
      VITE_API_URL: /mis-energy-api
    networks:
      - mis-network
    depends_on:
      - mis-energy-backend
    restart: unless-stopped

  # ==========================================
  # SERVIÇOS AUXILIARES (Legacy Core)
  # ==========================================

  # Legado Core Flask (Manter ou Remover? Mantendo por compatibilidade)
  flask:
    image: mis-core-flask:v1.1
    build:
      context: ./mis-core/backend-flask
      dockerfile: Dockerfile
    container_name: mis-core-flask
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
      INFLUXDB_USER: ${INFLUXDB_USER}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD}
      DJANGO_HOST: django
      DJANGO_PORT: 8000
      DJANGO_API_URL: http://django:8000/api
    ports:
      - "${FLASK_HOST_PORT}:5000"
    volumes:
      - ./mis-core/backend-flask:/app
    networks:
      - mis-network
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped

  coletor:
    image: mis-core-coletor:v1.0
    build:
      context: ./mis-core/coletor
      dockerfile: Dockerfile
    container_name: mis-core-coletor
    environment:
      DJANGO_API_URL: http://django:8000/api
      FLASK_API_URL: http://flask:5000/api
    volumes:
      - ./mis-core/coletor:/app
    networks:
      - mis-network
    restart: unless-stopped

  chronograf:
    image: chronograf:1.8
    container_name: mis-core-chronograf
    ports:
      - "8889:8888"
    environment:
      INFLUXDB_URL: http://influxdb:8086
    networks:
      - mis-network
    restart: unless-stopped

  kapacitor:
    image: kapacitor:1.5
    container_name: mis-core-kapacitor
    ports:
      - "9093:9092"
    environment:
      KAPACITOR_INFLUXDB_0_URLS_0: http://influxdb:8086
    volumes:
      - kapacitor_data:/var/lib/kapacitor
    networks:
      - mis-network
    restart: unless-stopped

volumes:
  mysql_data:
    name: mis-core-mysql-data
  influxdb_data:
    name: mis-core-influxdb-data
  kapacitor_data:
    name: mis-core-kapacitor-data
  django_static:
    name: mis-core-django-static

networks:
  mis-network:
    name: mis-hub-network
    driver: bridge

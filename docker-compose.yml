version: "3.8"

services:
  # ===== MYSQL =====
  mysql:
    image: mysql:8.0
    container_name: mis-core-mysql
    command: --default-authentication-plugin=mysql_native_password

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mis-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ===== INFLUXDB 1.8 =====
  influxdb:
    image: influxdb:1.8-alpine
    container_name: mis-core-influxdb
    environment:
      INFLUXDB_DB: ${INFLUXDB_DATABASE}
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      INFLUXDB_HTTP_AUTH_ENABLED: ${INFLUXDB_HTTP_AUTH_ENABLED}
      TZ: ${TZ}
    ports:
      - "${INFLUXDB_HOST_PORT}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - mis-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://localhost:8086/ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ===== DJANGO =====
  django:
    image: mis-core-django:v1.0
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    container_name: mis-core-django
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      INFLUXDB_HOST: ${INFLUXDB_HOST}
      INFLUXDB_PORT: ${INFLUXDB_PORT}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
      INFLUXDB_USER: ${INFLUXDB_USER}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD}

      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}

      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}

      TZ: ${TZ}
    ports:
      - "${DJANGO_HOST_PORT}:8000"
    volumes:
      - ./backend-django:/app
      - django_static:/app/staticfiles
    networks:
      - mis-network
    depends_on:
      mysql:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/admin/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ===== FLASK =====
  flask:
    image: mis-core-flask:v1.0
    build:
      context: ./backend-flask
      dockerfile: Dockerfile
    container_name: mis-core-flask
    environment:
      INFLUXDB_HOST: ${INFLUXDB_HOST}
      INFLUXDB_PORT: ${INFLUXDB_PORT}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
      INFLUXDB_USER: ${INFLUXDB_USER}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD}
      DJANGO_HOST: django
      DJANGO_PORT: 8000

      DJANGO_API_URL: ${DJANGO_API_URL}
      TZ: ${TZ}
    ports:
      - "${FLASK_HOST_PORT}:5000"
    volumes:
      - ./backend-flask:/app
    networks:
      - mis-network
    depends_on:
      django:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ===== COLETOR OPC UA =====
  coletor:
    image: mis-core-coletor:v1.0
    build:
      context: ./coletor
      dockerfile: Dockerfile
    container_name: mis-core-coletor
    environment:
      DJANGO_API_URL: http://django:8000/api
      FLASK_API_URL: http://flask:5000/api
      INTERVALO_COLETA: ${INTERVALO_COLETA:-2}
      TIMEOUT_REQUEST: ${TIMEOUT_REQUEST:-10}
      TZ: ${TZ}
    volumes:
      - ./coletor:/app
    networks:
      - mis-network
    depends_on:
      django:
        condition: service_healthy
      flask:
        condition: service_healthy
    restart: unless-stopped

  # ===== FRONTEND (NGINX) =====
  frontend:
    image: mis-core-frontend:v1.0
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        VITE_DJANGO_API_URL: ${VITE_DJANGO_API_URL}
        VITE_FLASK_API_URL: ${VITE_FLASK_API_URL}
        VITE_APP_LOGO: ${VITE_APP_LOGO}
        VITE_APP_TITLE: ${VITE_APP_TITLE}
        VITE_ANALYTICS_ENDPOINT: ${VITE_ANALYTICS_ENDPOINT}
        VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID}
    container_name: mis-core-frontend
    environment:
      TZ: ${TZ}
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    networks:
      - mis-network
    depends_on:
      django:
        condition: service_healthy
      flask:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ===== CHRONOGRAF =====
  chronograf:
    image: chronograf:1.8
    container_name: mis-core-chronograf
    ports:
      - "8889:8888"
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_USERNAME: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      TZ: ${TZ}
    networks:
      - mis-network
    depends_on:
      influxdb:
        condition: service_healthy
      kapacitor:
        condition: service_started
    restart: unless-stopped

  # ===== KAPACITOR =====
  kapacitor:
    image: kapacitor:1.5
    container_name: mis-core-kapacitor
    ports:
      - "9093:9092"
    environment:
      KAPACITOR_INFLUXDB_0_URLS_0: http://influxdb:8086
      KAPACITOR_INFLUXDB_0_USERNAME: ${INFLUXDB_ADMIN_USER}
      KAPACITOR_INFLUXDB_0_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      TZ: ${TZ}
    volumes:
      - kapacitor_data:/var/lib/kapacitor
    networks:
      - mis-network
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
    name: mis-core-mysql-data
  influxdb_data:
    name: mis-core-influxdb-data
  kapacitor_data:
    name: mis-core-kapacitor-data
  django_static:
    name: mis-core-django-static

networks:
  mis-network:
    name: mis-core-network
    driver: bridge

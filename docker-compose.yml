# =============================================================================
# docker-compose.yml  —  Stack de DESENVOLVIMENTO do mis-core
# =============================================================================
#
# O QUE ESTE ARQUIVO É (e o que NÃO é):
#   Este compose é para quem CLONA o repo e quer "docker compose up" em máquina
#   com internet. Ele BUILDA as imagens a partir do código local (contexts:).
#
#   Para deploy offline na rede OT (sem internet no servidor), use o compose
#   em ./mis-core-offline/docker-compose.yml que consome imagens já salvas
#   como tarball (docker save / docker load). Ver ./docs/DEPLOY_OT.md.
#
# CONFIGURAÇÃO:
#   cp .env.example .env   ← copie e ajuste as variáveis antes de subir
#
# ARQUITETURA DE REDE INTERNA (Strangler Pattern):
#
#   navegador --> frontend:80 (nginx SPA + reverse-proxy)
#                    │
#                    ├─ /api/django/  -> django:8000    (legado)
#                    ├─ /api/flask/   -> flask:5000     (legado)
#                    ├─ /api/v2/      -> fastapi:8000   (camada nova)
#                    └─ /             -> SPA React (static)
#
#   coletor (OPC UA) --> POST Django/Flask --> MySQL + InfluxDB
#
# POR QUE O PADRÃO DE URL IMPORTA:
#   Para poder migrar um endpoint por vez sem quebrar clientes antigos, o
#   FastAPI v2 espelha os paths do Flask (ex.: /analyze/stats) apenas trocando
#   o prefixo /api -> /api/v2. Isso é contrato sagrado deste compose.
# =============================================================================

version: "3.9"

x-common-env: &common-env
  TZ: America/Sao_Paulo

services:
  # ---------------------------------------------------------------------------
  # FRONTEND (Vite build + nginx serve + reverse-proxy interno)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend-react
      args:
        VITE_DJANGO_API_URL: /api
        # Flask-out completo: /flask-api removido. Mantido apontando para
        # /api como salvaguarda - se algum import esquecido bater, cai no
        # Django em vez de 404.
        VITE_FLASK_API_URL: /api
        VITE_FASTAPI_V2_URL: /api/v2
        VITE_APP_TITLE: "MIS Core"
        # Versionamento determinístico — gravado no bundle E no /version.json
        # Se MIS_VERSION/MIS_GIT_HASH/MIS_BUILD_TIME não vierem do .env, o
        # Dockerfile cai em defaults (ver ARGs lá).
        MIS_VERSION: "${MIS_VERSION:-dev}"
        MIS_GIT_HASH: "${MIS_GIT_HASH:-no-git}"
        MIS_BUILD_TIME: "${MIS_BUILD_TIME:-unknown}"
    image: "mis-core-frontend:${MIS_VERSION:-dev}"
    container_name: mis-core-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      django:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    networks: [mis-network]

  # ---------------------------------------------------------------------------
  # DJANGO  (ORM + CRUD de linhas/equipamentos/metadata)
  # ---------------------------------------------------------------------------
  django:
    build:
      context: ./backend-django
      args:
        MIS_VERSION: "${MIS_VERSION:-dev}"
        MIS_GIT_HASH: "${MIS_GIT_HASH:-no-git}"
        MIS_BUILD_TIME: "${MIS_BUILD_TIME:-unknown}"
    image: "mis-core-django:${MIS_VERSION:-dev}"
    container_name: mis-core-django
    restart: unless-stopped
    environment:
      <<: *common-env
      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_DB: "${MYSQL_DATABASE:-mis_core_db}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-mis_core_db}"
      MYSQL_USER: "${MYSQL_USER:-mis}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-mis123}"
      # InfluxDB
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "${INFLUXDB_PORT:-8086}"
      INFLUXDB_DATABASE: "${INFLUXDB_DATABASE:-industrial_db}"
      INFLUXDB_USER: "${INFLUXDB_USER:-admin}"
      INFLUXDB_PASSWORD: "${INFLUXDB_PASSWORD:-admin123}"
      # Django
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-django-insecure-dev-key-CHANGE-IN-PROD}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-True}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-*}"
      DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME:-admin}"
      DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL:-admin@example.com}"
      DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD:-admin123}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-django-insecure-dev-key-CHANGE-IN-PROD}"
      SESSION_COOKIE_DOMAIN: "${SESSION_COOKIE_DOMAIN:-}"
    volumes:
      - django_static:/app/staticfiles
    depends_on:
      mysql:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [mis-network]

  # ---------------------------------------------------------------------------
  # FLASK REMOVIDO (Flask-out completo - todos os endpoints portados para Django).
  # Backend Flask continua em backend-flask/ apenas como referencia historica;
  # nao e mais buildado ou iniciado. Migracao detalhada:
  #   - equipamentos/flask_replacement_views.py
  #   - equipamentos/analytics_views.py
  #   - equipamentos/production_engine.py (copia do Flask)
  #   - equipamentos/oee_formula.py (copia do Flask)
  #   - equipamentos/golden_state_queue.py (substitui services/command_queue.py)
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # FASTAPI v2  (NOVA camada de analytics — ISO 22400, OFF-mask, EDA)
  # ---------------------------------------------------------------------------
  fastapi:
    build:
      context: ./backend-fastapi
    image: "mis-core-fastapi:${MIS_VERSION:-dev}"
    container_name: mis-core-fastapi
    restart: unless-stopped
    environment:
      <<: *common-env
      APP_NAME: mis-core-fastapi
      ENVIRONMENT: "${FASTAPI_ENVIRONMENT:-dev}"
      DEBUG: "${FASTAPI_DEBUG:-true}"
      API_V2_PREFIX: /api/v2
      LOG_LEVEL: "${FASTAPI_LOG_LEVEL:-INFO}"
      CORS_ORIGINS: "${FASTAPI_CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://frontend}"
      # InfluxDB
      INFLUX_HOST: influxdb
      INFLUX_PORT: "${INFLUXDB_PORT:-8086}"
      INFLUX_DB: "${INFLUXDB_DATABASE:-industrial_db}"
      INFLUX_USERNAME: "${INFLUXDB_USER:-admin}"
      INFLUX_PASSWORD: "${INFLUXDB_PASSWORD:-admin123}"
      INFLUX_TIMEOUT_S: 10
      DJANGO_API_URL: http://django:8000/api
      # JWT — mesmo secret do Django para tokens cruzados valerem
      JWT_SECRET: "${JWT_SECRET_KEY:-django-insecure-dev-key-CHANGE-IN-PROD}"
      JWT_ALGORITHM: HS256
      # Postgres é placeholder para features futuras
      PG_DSN: "${PG_DSN:-postgresql://user:pass@localhost:5432/mis_core}"
      MAX_POINTS_PER_RESPONSE: "${MAX_POINTS_PER_RESPONSE:-10000}"
      MAX_CORRELATION_VARIABLES: "${MAX_CORRELATION_VARIABLES:-25}"
      PROMETHEUS_ENABLED: "${PROMETHEUS_ENABLED:-true}"
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [mis-network]

  # ---------------------------------------------------------------------------
  # COLETOR OPC UA  (asyncua + watchdog + OfflineBuffer SQLite)
  # ---------------------------------------------------------------------------
  coletor:
    build:
      context: ./coletor
    image: "mis-core-coletor:${MIS_VERSION:-dev}"
    container_name: mis-core-coletor
    restart: unless-stopped
    environment:
      <<: *common-env
      DJANGO_API_URL: http://django:8000/api
      # Ingestao e comandos do coletor hoje estao no Django.
      INGEST_API_URL: http://django:8000/api
      INTERVALO_COLETA: "${INTERVALO_COLETA:-2}"
      TIMEOUT_REQUEST: "${TIMEOUT_REQUEST:-10}"
    depends_on:
      django:
        condition: service_healthy
    networks: [mis-network]

  # ---------------------------------------------------------------------------
  # MYSQL  (metadata relacional: linhas, equipamentos, ordens, produtos)
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mis-core-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      <<: *common-env
      MYSQL_DATABASE: "${MYSQL_DATABASE:-mis_core_db}"
      MYSQL_USER: "${MYSQL_USER:-mis}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-mis123}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root123}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [mis-network]

  # ---------------------------------------------------------------------------
  # INFLUXDB 1.8  (time-series: OPC UA raw + KPIs consolidados)
  # ---------------------------------------------------------------------------
  influxdb:
    image: influxdb:1.8-alpine
    container_name: mis-core-influxdb
    restart: unless-stopped
    environment:
      <<: *common-env
      INFLUXDB_DB: "${INFLUXDB_DATABASE:-industrial_db}"
      INFLUXDB_ADMIN_USER: "${INFLUXDB_USER:-admin}"
      INFLUXDB_ADMIN_PASSWORD: "${INFLUXDB_PASSWORD:-admin123}"
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
    volumes:
      - influxdb_data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [mis-network]

  # ---------------------------------------------------------------------------
  # CHRONOGRAF  (admin web do InfluxDB — opcional, útil em debug)
  # ---------------------------------------------------------------------------
  chronograf:
    image: chronograf:1.8
    container_name: mis-core-chronograf
    restart: unless-stopped
    ports:
      - "${CHRONOGRAF_PORT:-8888}:8888"
    environment:
      <<: *common-env
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_USERNAME: "${INFLUXDB_USER:-admin}"
      INFLUXDB_PASSWORD: "${INFLUXDB_PASSWORD:-admin123}"
    depends_on:
      influxdb:
        condition: service_healthy
    networks: [mis-network]

  # ---------------------------------------------------------------------------
  # GRAFANA / NODE-RED / EMQX — refletem o stack OFFLINE para que o pacote
  # exportado contenha as imagens. Em DEV são opcionais (rodam se subir).
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: mis-core-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      <<: *common-env
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin123}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Acessado direto pela porta nativa (3001) — sem sub-path, sem proxy.
      # Antes havia GF_SERVER_ROOT_URL=/grafana/ + SERVE_FROM_SUB_PATH=true
      # para servir via nginx em /grafana/, mas isso causava redirects
      # internos para a porta INTERNA 3000 (inacessível de fora). Voltando
      # ao default elimina toda essa classe de problema.
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy
    networks: [mis-network]

  node-red:
    image: nodered/node-red:4.0.9-20
    container_name: mis-core-nodered
    restart: unless-stopped
    # Porta 1880 NÃO exposta publicamente — acesso só via gateway nginx
    # em /nodered/, que valida sessão+permissão via /api/auth/check-nodered/.
    # Quem tentar localhost:1880 direto encontra "connection refused".
    # Para acesso de emergência durante debug, descomente as 2 linhas abaixo.
    # ports:
    #   - "${NODE_RED_PORT:-1880}:1880"
    environment:
      <<: *common-env
      # adminAuth/users do settings.js consultam estes valores para chamar
      # o Django (`/api/auth/nodered/{authenticate,user}/`).
      DJANGO_HOST: "django"
      DJANGO_PORT: "8000"
    volumes:
      - nodered_data:/data
      # settings.js versionado no repo (não fica no volume) — qualquer
      # alteração em ./node-red/settings.js entra em vigor com um
      # `docker compose restart node-red`, sem rebuild.
      - ./node-red/settings.js:/data/settings.js:ro
    networks: [mis-network]
    depends_on:
      - django

  emqx:
    image: emqx/emqx:5.6.1
    container_name: mis-core-emqx
    restart: unless-stopped
    ports:
      - "${EMQX_MQTT_PORT:-1883}:1883"
      - "${EMQX_WS_PORT:-8083}:8083"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    environment:
      <<: *common-env
      EMQX_DASHBOARD__DEFAULT_USERNAME: "${EMQX_ADMIN_USER:-admin}"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${EMQX_ADMIN_PASSWORD:-public}"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    networks: [mis-network]

  # ---------------------------------------------------------------------------
  # PORTAINER (gestao dos containers pelo Hub de Solucoes)
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:2.39.5-alpine
    container_name: mis-core-portainer
    restart: unless-stopped
    command:
      - --base-url
      - /mc-portainer
      # Cria o admin nativo sem depender da janela de setup de cinco minutos.
      - --admin-password-file
      - /run/secrets/portainer_admin_password
    secrets:
      - portainer_admin_password
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks: [mis-network]

networks:
  mis-network:
    name: mis-core-network
    driver: bridge

volumes:
  mysql_data:
  influxdb_data:
  django_static:
  grafana_data:
  nodered_data:
  emqx_data:
  emqx_log:
  portainer_data:

secrets:
  portainer_admin_password:
    environment: PORTAINER_ADMIN_PASSWORD

version: '3.8'

services:
  # ===== BANCO DE DADOS POSTGRESQL =====
  postgres:
    image: postgres:15-alpine
    container_name: mis-core-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== INFLUXDB (SÉRIE TEMPORAL) =====
  influxdb:
    image: influxdb:1.8-alpine
    container_name: mis-core-influxdb
    environment:
      INFLUXDB_DB: ${INFLUXDB_DATABASE}
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      INFLUXDB_HTTP_AUTH_ENABLED: ${INFLUXDB_HTTP_AUTH_ENABLED}
      TZ: ${TZ}
    ports:
      - "${INFLUXDB_PORT}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - mis-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== BACKEND DJANGO =====
  django:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    container_name: mis-core-django
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      INFLUXDB_HOST: ${INFLUXDB_HOST}
      INFLUXDB_PORT: 8086
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
      INFLUXDB_USER: ${INFLUXDB_USER}
      INFLUXDB_USER_PASSWORD: ${INFLUXDB_USER_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${DJANGO_PORT}:8000"
    volumes:
      - ./backend-django:/app
      - django_static:/app/staticfiles
    networks:
      - mis-network
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ===== BACKEND FLASK =====
  flask:
    build:
      context: ./backend-flask
      dockerfile: Dockerfile
    container_name: mis-core-flask
    environment:
      INFLUXDB_HOST: ${INFLUXDB_HOST}
      INFLUXDB_PORT: 8086
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
      INFLUXDB_USER: ${INFLUXDB_USER}
      INFLUXDB_USER_PASSWORD: ${INFLUXDB_USER_PASSWORD}
      DJANGO_API_URL: ${DJANGO_API_URL}
      DJANGO_PORT: 8000
      TZ: ${TZ}
    ports:
      - "${FLASK_PORT}:5000"
    volumes:
      - ./backend-flask:/app
    networks:
      - mis-network
    depends_on:
      django:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ===== FRONTEND REACT =====
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        VITE_DJANGO_API_URL: ${VITE_DJANGO_API_URL}
        VITE_FLASK_API_URL: ${VITE_FLASK_API_URL}
    container_name: mis-core-frontend
    environment:
      VITE_DJANGO_API_URL: ${VITE_DJANGO_API_URL}
      VITE_FLASK_API_URL: ${VITE_FLASK_API_URL}
      TZ: ${TZ}
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - mis-network
    depends_on:
      - django
      - flask
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

# ===== VOLUMES =====
volumes:
  postgres_data:
    name: mis-core-postgres-data
  influxdb_data:
    name: mis-core-influxdb-data
  django_static:
    name: mis-core-django-static

# ===== REDE =====
networks:
  mis-network:
    name: mis-core-network
    driver: bridge

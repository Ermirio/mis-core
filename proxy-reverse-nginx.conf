# Arquivo: proxy-reverse/nginx.conf
# Proxy reverso principal — atende por IP E por domínio.
#
# COMO É ACESSADO:
#   - Hoje:   http://192.168.30.71:3000/...  (rede OT, via NAT corporativo)
#   - Futuro: http://hub.mis.local/...        (quando o DNS estiver pronto)
#
#   O `server_name _` + `default_server` faz com que QUALQUER Host header
#   (IP, domínio configurado, ou nenhum) caia no bloco principal — ou seja,
#   o mesmo arquivo serve os dois cenários sem mudança.
#
# MIGRAÇÃO DESTA VERSÃO:
#   - MIS Core legado (frontend_mis_core / backend_django_core / backend_flask_core)
#     removido — substituído pelo upstream `mis_core_standalone` que aponta para
#     a nova máquina OT 192.168.70.160:8080. O nginx INTERNO daquela máquina faz
#     todo o roteamento fino (/api → django, /api/v2 → fastapi, /flask-api →
#     rewrite, etc.), portanto aqui só repassamos a URI íntegra.
#
#   - MIS AI legado removido (será reintroduzido na próxima sessão).
#
#   - Ferramentas auxiliares antigas (.71) MANTIDAS em /grafana/, /nodered/,
#     /emqx/, /chronograf/ — outras apps ainda dependem delas.
#
#   - Ferramentas auxiliares DO MIS Core stand-alone (.160) acessíveis via
#     rotas dedicadas /mc-*/ no hub:
#         /mc-grafana/      → http://192.168.70.160:3001/
#         /mc-chronograf/   → http://192.168.70.160:8888/
#         /mc-emqx/         → http://192.168.70.160:18083/
#         /mc-nodered/      → http://192.168.70.160:8080/nodered/  (passa pelo
#                              gateway de autenticação Django do MIS Core).
#
# PRÉ-REQUISITOS NO MIS CORE (.160) para acesso via proxy:
#   1. Django (.env): adicionar o host externo em DJANGO_ALLOWED_HOSTS e
#      CSRF_TRUSTED_ORIGINS. Exemplos:
#         DJANGO_ALLOWED_HOSTS=*
#         CSRF_TRUSTED_ORIGINS=http://192.168.30.71:3000,http://hub.mis.local
#   2. Firewall da .160: liberar inbound vindo da .71 nas portas
#         8080  (frontend + APIs Django/FastAPI)
#         3001  (Grafana) — opcional, só se quiser usar /mc-grafana/
#         8888  (Chronograf) — idem
#         18083 (EMQX Dashboard) — idem
#      Porta 1880 (Node-RED) NÃO precisa estar exposta — passa via 8080.
# ==============================================================================


# ==============================================================================
# UPSTREAMS (definição dos serviços internos)
# ==============================================================================

# --- MIS Core (NOVA máquina OT) ---
# O nginx interno em 192.168.70.160:8080 já tem locations /mis-core/, /api/,
# /api/v2/, /flask-api/, /static/ e /mis-core-admin/. Encaminhamos sempre a
# URI íntegra para que aquele roteamento se preserve.
upstream mis_core_standalone     { server 192.168.70.160:8080; }

# --- Ferramentas auxiliares DO MIS Core stand-alone (.160) ---
# Acesso via subpath /mc-*/ deste proxy, com rewrite removendo o prefixo
# antes do upstream (cada ferramenta pensa que está servida na raiz).
upstream mc_grafana              { server 192.168.70.160:8080; }
upstream mc_chronograf           { server 192.168.70.160:8080; }
upstream mc_emqx_dashboard       { server 192.168.70.160:8080; }
# Node-RED do MIS Core stand-alone passa pelo gateway de auth do nginx
# INTERNO da máquina .160 (que valida sessão Django + permissão
# `equipamentos.access_nodered` antes de liberar). Por isso aponta para
# a porta 8080 — mesmo upstream do mis_core_standalone, com path /nodered/.
upstream mc_nodered_via_gateway  { server 192.168.70.160:8080; }
# Portainer passa pelo frontend nginx da .160, sem publicar porta administrativa.
# A autenticacao e feita exclusivamente pelo proprio Portainer.
upstream mc_portainer_via_frontend { server 192.168.70.160:8080; }

# --- Ferramentas antigas (.71) — intocadas, compartilhadas por outras apps ---
upstream backend_nodered         { server node-red:1880; }
upstream frontend_grafana        { server grafana:3000; }
upstream backend_emqx_dashboard  { server emqx:18083; }
upstream backend_chronograf      { server chronograf:8888; }
upstream backend_portainer       { server portainer:9000; }

# --- Demais aplicações (mantidas como estavam) ---
upstream frontend_mis_energy     { server mis-energy-frontend:3008; }
upstream backend_mis_energy      { server mis-energy-backend:5005; }
upstream frontend_mis_changeover { server mis-changeover-frontend:80; }
upstream backend_mis_changeover  { server mis-changeover-backend:8000; }
upstream frontend_mis_planning   { server mis-planning-frontend:80; }
upstream backend_mis_planning    { server mis-planning-backend:8000; }


# ==============================================================================
# SERVER: HUB PRINCIPAL — atende IP E domínio
#
# `default_server` + `server_name _ hub.mis.local localhost` faz este
# bloco capturar QUALQUER Host header. Funciona tanto via IP direto
# (http://192.168.30.71:3000/...) quanto via domínio quando o DNS for
# configurado (http://hub.mis.local/...).
# ==============================================================================
server {
    listen 80 default_server;
    server_name _ hub.mis.local localhost;

    # Preserva a porta original do cliente nos redirects (ex.: :3000).
    absolute_redirect off;
    port_in_redirect off;

    # --- Landing Page (estático) ---
    location / {
        root /usr/share/nginx/html/hub;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --- Assets comuns ---
    location /imagens/ {
        alias /usr/share/nginx/html/imagens/;
    }

    # ==========================================================================
    # MIS CORE (na nova máquina OT 192.168.70.160:8080)
    #
    # Todo o roteamento fino (Django, FastAPI, Flask-legacy rewrite, admin,
    # static) é feito pelo nginx INTERNO da máquina .160. Aqui só
    # encaminhamos a URI íntegra para o upstream.
    # ==========================================================================

    # --- Frontend SPA React ---
    location /mis-core/ {
        proxy_pass http://mis_core_standalone;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # WebSocket — HMR/live updates eventuais
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    # --- Django REST API (rota genérica usada pelo frontend novo) ---
    location /api/ {
        proxy_pass http://mis_core_standalone;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Suporte a WebSocket (FastAPI streaming via /api/v2/* ainda passa por aqui)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- FastAPI v2 (Strangler Pattern) ---
    # `location /api/v2/` precisa vir DEPOIS de `/api/` no arquivo para que
    # o longest-prefix-match do nginx priorize esta regra mais específica.
    location /api/v2/ {
        proxy_pass http://mis_core_standalone;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # --- Django REST API (rota dedicada — compat com builds antigos do front) ---
    location /mis-core-api/ {
        proxy_pass http://mis_core_standalone;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # --- Django Admin ---
    location /mis-core-admin/ {
        proxy_pass http://mis_core_standalone;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # CSRF do admin precisa do Origin original
        proxy_set_header Origin $http_origin;
    }

    # --- Django Static (Admin CSS/JS) ---
    location /static/ {
        proxy_pass http://mis_core_standalone;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Legacy Flask API (rewrite feito pelo nginx interno da máquina .160) ---
    location /flask-api/ {
        proxy_pass http://mis_core_standalone;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # --- Legacy Flask API (rota dedicada) ---
    # Reescreve para o caminho que o nginx interno espera (/flask-api/).
    location /mis-core-flask-api/ {
        rewrite ^/mis-core-flask-api/(.*)$ /flask-api/$1 break;
        proxy_pass http://mis_core_standalone;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================================
    # FERRAMENTAS AUXILIARES DO MIS CORE stand-alone (.160)
    #
    # Padrão: prefix `/mc-*/` neste hub, rewrite removendo o prefix antes do
    # upstream (cada ferramenta pensa que está servida na raiz).
    #
    # AVISO sobre assets/redirects:
    #   Grafana, Chronograf e EMQX geram redirects e assets com URLs ABSOLUTAS
    #   (ex.: Grafana redireciona para /login). Servir via subpath sem
    #   configuração específica pode quebrar partes da UI.
    #
    #   Para fix DEFINITIVO (recomendado quando for utilizar em produção):
    #     - Grafana    : no compose do MIS Core, definir
    #                       GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/mc-grafana/
    #                       GF_SERVER_SERVE_FROM_SUB_PATH=true
    #     - Chronograf : passar `--basepath=/mc-chronograf`
    #     - EMQX       : ajustar dashboard.path_prefix=/mc-emqx
    #
    #   Sem essa configuração, o acesso pelo subpath funciona para abrir a
    #   tela inicial, mas alguns recursos internos podem precisar de ajustes.
    #   Para uso sem fricção, o caminho mais simples no curto prazo é abrir
    #   essas ferramentas dentro da rede OT pela porta direta
    #   (192.168.70.160:3001, :8888, :18083).
    # ==========================================================================

    # --- Grafana do MIS Core stand-alone ---
    location /mc-grafana/ {
        proxy_pass http://mc_grafana;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # WebSocket (Grafana Live)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Chronograf do MIS Core stand-alone ---
    location /mc-chronograf/ {
        proxy_pass http://mc_chronograf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- EMQX Dashboard do MIS Core stand-alone ---
    location /mc-emqx/ {
        proxy_pass http://mc_emqx_dashboard;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Node-RED do MIS Core stand-alone (via gateway de auth Django) ---
    # Em vez de bater na porta 1880 do Node-RED, passamos pelo nginx INTERNO
    # da máquina .160 em /nodered/ — ele valida sessão Django + permissão
    # `equipamentos.access_nodered` antes de liberar. Se o usuário não tem
    # sessão, o gateway interno redireciona para o login do admin Django.
    location /mc-nodered/ {
        proxy_pass http://mc_nodered_via_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # WebSocket (editor do Node-RED em tempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 50m;
        proxy_read_timeout 300s;
    }

    # --- Portainer do MIS Core stand-alone (autenticacao nativa) ---
    # O path e preservado porque o Portainer usa --base-url /mc-portainer.
    location = /mc-portainer {
        return 301 /mc-portainer/;
    }
    location /mc-portainer/ {
        proxy_pass http://mc_portainer_via_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
        client_max_body_size 100m;
        proxy_read_timeout 300s;
    }

    # ==========================================================================
    # MIS CHANGE OVER
    # ==========================================================================

    # FIX v7.0: proxy_pass sem trailing slash para preservar o prefixo
    # /mis-change-over/ ao ser passado ao frontend. Com trailing slash o
    # nginx strip o prefixo, o frontend retornava redirect 302
    # /mis-change-over/ → loop infinito → browser trocava para https.
    # Bloco exact-match para redirecionar URI sem barra antes do prefix-match.
    location = /mis-change-over {
        return 301 /mis-change-over/;
    }
    location /mis-change-over/ {
        proxy_pass http://frontend_mis_changeover;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout estendido para operações longas (troca de SKU com múltiplos CLPs/tags)
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # --- MIS Change Over Backend API ---
    location /mis-change-over-api/ {
        proxy_pass http://backend_mis_changeover/api/;

        # Corrige redirects internos do Django (trailing slashes)
        proxy_redirect /api/ /mis-change-over-api/;
        proxy_redirect http://$host:$server_port/api/ http://$host:$server_port/mis-change-over-api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # --- MIS Change Over Data API (Flask/Density) — fallback para Host ---
    location /mis-change-over-data-api/ {
        proxy_pass http://host.docker.internal:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- MIS Change Over Django Admin ---
    location = /mis-change-over-admin {
        return 301 /mis-change-over-admin/;
    }

    location /mis-change-over-admin/ {
        proxy_pass http://backend_mis_changeover/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";

        proxy_redirect /admin/ /mis-change-over-admin/;
        proxy_redirect / /mis-change-over-admin/;

        sub_filter 'data-href-template="/admin/' 'data-href-template="/mis-change-over-admin/';
        sub_filter '/static/' '/mis-change-over-static/';
        sub_filter 'href="/admin/' 'href="/mis-change-over-admin/';
        sub_filter 'action="/admin/' 'action="/mis-change-over-admin/';
        sub_filter 'data-ajax--url="/admin/' 'data-ajax--url="/mis-change-over-admin/';
        sub_filter 'src="/admin/' 'src="/mis-change-over-admin/';
        sub_filter 'data-popup-activation-url="/admin/' 'data-popup-activation-url="/mis-change-over-admin/';

        sub_filter_once off;
        sub_filter_types *;
    }

    # --- MIS Change Over Static Files (Django Admin CSS/JS) ---
    location /mis-change-over-static/ {
        proxy_pass http://backend_mis_changeover;
        proxy_set_header Host $host;
    }

    # ==========================================================================
    # MIS ENERGY
    # ==========================================================================

    location /mis-energy/ {
        proxy_pass http://frontend_mis_energy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /mis-energy-api/ {
        proxy_pass http://backend_mis_energy/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================================
    # FERRAMENTAS AUXILIARES ANTIGAS (.71) — mantidas até serem removidas.
    # Compartilhadas por outras apps (Change Over, Energy, Planning).
    # ==========================================================================

    location /grafana/ {
        proxy_pass http://frontend_grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /nodered/ {
        rewrite ^/nodered/(.*)$ /$1 break;
        proxy_pass http://backend_nodered;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    location /emqx/ {
        proxy_pass http://backend_emqx_dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /chronograf/ {
        proxy_pass http://backend_chronograf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /portainer/ {
        proxy_pass http://backend_portainer/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    # ==========================================================================
    # MIS PLANNING
    # ==========================================================================

    location /mis-planning/ {
        proxy_pass http://frontend_mis_planning/mis-planning/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /mis-planning-api/ {
        proxy_pass http://backend_mis_planning/api/;
        proxy_redirect /api/ /mis-planning-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mis-planning-admin {
        return 301 /mis-planning-admin/;
    }

    location /mis-planning-admin/ {
        proxy_pass http://backend_mis_planning/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_redirect /admin/ /mis-planning-admin/;
        sub_filter '/static/' '/mis-planning-static/';
        sub_filter 'href="/admin/' 'href="/mis-planning-admin/';
        sub_filter 'action="/admin/' 'action="/mis-planning-admin/';
        sub_filter 'data-ajax--url="/admin/' 'data-ajax--url="/mis-planning-admin/';
        sub_filter_once off;
        sub_filter_types *;
    }

    location /mis-planning-static/ {
        proxy_pass http://backend_mis_planning/mis-planning-static/;
        proxy_set_header Host $host;
    }
}


# ==============================================================================
# SERVERS dedicados por subdomínio (entram em uso quando o DNS for configurado)
# ==============================================================================

# --- MIS CHANGE OVER (changeover.mis.local) ---
server {
    listen 80;
    server_name changeover.mis.local;

    # FIX v7.0: proxy_pass sem trailing slash — mesmo motivo do bloco hub
    # acima. Com trailing slash o nginx strip o path, o frontend entrava
    # em loop de redirect.
    location / {
        proxy_pass http://frontend_mis_changeover;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mis-change-over-api/ {
        proxy_pass http://backend_mis_changeover/api/;
        proxy_redirect /api/ /mis-change-over-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location /data-api/ {
        proxy_pass http://host.docker.internal:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://host.docker.internal:8080/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

# Configuração Nginx - Predição Genérica
# Adicione este bloco ao nginx.conf principal (dentro do server block)

# ==================== FRONTEND - PREDIÇÃO GENÉRICA ====================
# Serve a aplicação React/Vite
location /prediction-app/ {
    proxy_pass http://predicao_frontend_container:3007/prediction-app/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Timeout para SPA
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
}

# ==================== BACKEND API - PREDIÇÃO GENÉRICA ====================
# Proxy para API Flask
location /predicao-api/ {
    proxy_pass http://predicao_backend_container:5004/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Timeout para operações de ML (treino pode demorar)
    proxy_read_timeout 600;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    
    # Buffer para grandes respostas (dados de predição)
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
}

# ==================== INSTRUÇÕES ====================
#
# 1. Abra o arquivo nginx.conf principal (01-Proxy/nginx.conf)
#
# 2. Localize o bloco "server" que escuta na porta 3000
#
# 3. Adicione os blocos "location" acima ANTES do bloco "location /"
#
# 4. Certifique-se de que os containers estão na rede "shared-network"
#
# 5. Teste a configuração:
#    docker exec nginx_container nginx -t
#
# 6. Recarregue o Nginx:
#    docker exec nginx_container nginx -s reload
#
# 7. Acesse:
#    Frontend: http://192.168.15.13:3000/prediction-app/
#    API: http://192.168.15.13:3000/predicao-api/health

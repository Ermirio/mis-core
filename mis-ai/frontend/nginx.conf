# Nginx Configuration - Frontend Predição Genérica
# Serve a aplicação React/Vite buildada

server {
    listen 3007;
    server_name localhost;

    # Diretório raiz
    root /usr/share/nginx/html;
    index index.html;

    # Logs
    access_log /var/log/nginx/prediction-app-access.log;
    error_log /var/log/nginx/prediction-app-error.log;

    # Servir aplicação React em /prediction-app/
    location /prediction-app/ {
        alias /usr/share/nginx/html/prediction-app/;
        try_files $uri $uri/ /prediction-app/index.html;
        
        # Headers para SPA
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Servir assets estáticos com cache
    location /prediction-app/assets/ {
        alias /usr/share/nginx/html/prediction-app/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redirect root para /prediction-app/
    location = / {
        return 301 /prediction-app/;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
}


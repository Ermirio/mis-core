# ==============================================================================
# SERVER: MIS CHANGE OVER (changeover.mis.local)
# ==============================================================================
server {
    listen 80;
    server_name changeover.mis.local;

    location / {
        proxy_pass http://frontend_mis_changeover;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rota de API via domínio direto
    location /mis-change-over-api/ {
        proxy_pass http://backend_mis_changeover/api/;
        proxy_redirect /api/ /mis-change-over-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # API de Dados (Flask/Density)
    location /data-api/ {
        proxy_pass http://host.docker.internal:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API LLM (Llama)
    location /v1/ {
        proxy_pass http://host.docker.internal:8080/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}



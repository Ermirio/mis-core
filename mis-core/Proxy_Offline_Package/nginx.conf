# Arquivo: 01-Proxy/nginx.conf (Atualizado com Node-RED Embalagem e Process Packing)

# Define os "upstreams" (serviços de destino)
upstream frontend_react_mis      { server host.docker.internal:3005; } # Frontend MIS
upstream backend_django_mis     { server host.docker.internal:8000; } # Backend MIS
upstream frontend_react_density  { server host.docker.internal:3006; } # Frontend Density App
upstream backend_flask_density  { server host.docker.internal:5001; } # Backend Density App
upstream frontend_react_predicao { server host.docker.internal:3007; } # Frontend Predict Generic
upstream backend_flask_predicao  { server host.docker.internal:5004; } # Backend Predict Generic

upstream grafana_service         { server host.docker.internal:3001; } # Grafana (TIG Stack)
upstream influxdb_service       { server host.docker.internal:8181; } # InfluxDB API (TIG Stack)
upstream nodered_service        { server host.docker.internal:1880; } # Node-RED Principal (Stack 06)
upstream nodered_embalagem     { server host.docker.internal:1884; } # NOVO: Node-RED Embalagem
upstream nodered_process_paking { server host.docker.internal:1885; } # NOVO: Node-RED Process Packing
# upstream backend_llm             { server host.docker.internal:8080; } # LLM (Comentado)

server {
    listen 80;
    server_name localhost;

    # ==================== LOCATIONS ESPECÍFICAS (ORDEM IMPORTA!) ====================
    # As locations mais específicas devem vir ANTES das genéricas

    # --- Rota: Backend MIS (Django API) ---
    location /api/ {
        proxy_pass http://backend_django_mis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Django Admin ---
    location /admin/ {
        proxy_pass http://backend_django_mis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Arquivos estáticos APENAS do Django Admin ---
    location /static/admin/ {
        proxy_pass http://backend_django_mis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Sincronizar SKUs ---
    location /sincronizar-skus/ {
        proxy_pass http://backend_django_mis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Frontend Density App ---
    location /density-app/ {
        proxy_pass http://frontend_react_density/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # --- Rota: Backend Density App (Flask API) ---
    location /density-api/ {
        rewrite ^/density-api/(.*)$ /api/$1 break;
        proxy_pass http://backend_flask_density;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Frontend Predict Generic ---
    location /prediction-app/ {
        proxy_pass http://frontend_react_predicao/; # Note a barra final aqui se o frontend espera isso
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        # Timeouts: 300s (Exemplo, ajuste se necessário)
        # proxy_connect_timeout 300s;
        # proxy_send_timeout    300s;
        # proxy_read_timeout    300s;
    }

    # --- Rota: Backend Predict Generic (Flask API) ---
    location /predicao-api/ {
        rewrite ^/predicao-api/(.*)$ /api/$1 break; # Remove /predicao-api/ e adiciona /api/
        proxy_pass http://backend_flask_predicao;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeouts: 600s (Exemplo para ML, ajuste se necessário)
        # proxy_connect_timeout 600s;
        # proxy_send_timeout    600s;
        # proxy_read_timeout    600s;
        # proxy_buffering off; # Pode ser útil para long-polling ou streaming
    }


    # --- Rota: Grafana (TIG Stack) ---
    location /grafana/ {
        proxy_pass http://grafana_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Rota: InfluxDB API (TIG Stack) ---
    location /influxdb/ {
        proxy_pass http://influxdb_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rota: Node-RED Principal (Stack 06) ---
    location /nodered/ {
        proxy_pass http://nodered_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Rota para Node-RED Embalagem ---
    location /nodered-embalagem/ {
        proxy_pass http://nodered_embalagem/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Rota para Node-RED Process Packing ---
    location /nodered-process-paking/ {
        proxy_pass http://nodered_process_paking/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Rota: LLM (Comentada) ---
    # location /v1/ {
    #     proxy_pass http://backend_llm;
    #     # ... headers ...
    # }

    # ==================== LOCATION GENÉRICA (DEVE SER A ÚLTIMA!) ====================

    # --- Rota: Frontend MIS (Aplicação Principal - Catch-all) ---
    location / {
        proxy_pass http://frontend_react_mis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS — resolve upstreams at request time, not at startup.
    # This prevents "host not found in upstream" crashes when dependent
    # services (flask, fastapi) haven't started yet or are temporarily down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redireciona raiz para o base path do app
    location = / {
        return 301 /mis-core/;
    }

    # SPA routing - todas as rotas retornam index.html
    location / {
        try_files $uri $uri/ /mis-core/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ==========================================================================
    # Proxy para APIs — modo standalone (sem hub proxy-reverse na frente).
    #
    # O React é buildado com paths relativos que o hub proxy já conhece:
    #   VITE_DJANGO_API_URL  = /api       (hub: /api/ → django:8000)
    #   VITE_FLASK_API_URL   = /flask-api (hub: /flask-api/ rewrite → flask:5000)
    #   VITE_FASTAPI_V2_URL  = /api/v2    (hub: /api/v2/ → fastapi:8000)
    #
    # Em modo standalone (docker compose up sem hub) este nginx é o único
    # gateway, portanto precisa dos mesmos caminhos.
    # Nginx usa prefixo mais longo: /api/v2/ vence sobre /api/.
    # ==========================================================================

    location /api/ {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /flask-api/ {
        set $flask_upstream http://flask:5000;
        rewrite ^/flask-api/(.*)$ /api/$1 break;
        proxy_pass $flask_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # FastAPI v2 (Strangler Pattern — camada nova coexistindo com Flask/Django).
    #
    # Racional (por que um bloco novo em vez de reaproveitar /api/):
    #   - A camada v2 precisa de header passthrough para JWT Bearer tokens e
    #     suporte a WebSocket futuro (/ws/live) sem cruzar com Flask/Django;
    #   - Aqui NÃO rewriting-path: o FastAPI mantém o próprio prefix /api/v2
    #     internamente (ver backend-fastapi/app/config.py), então o URL é
    #     1-para-1 cliente <-> servidor e o Swagger/docs em /api/v2/docs
    #     funciona sem gambiarra.
    #   - O frontend React consome via VITE_FASTAPI_V2_URL (default '/api/v2')
    #     em client/src/config/api.ts.
    # =========================================================================
    location /api/v2/ {
        set $fastapi_upstream http://fastapi:8000;
        proxy_pass $fastapi_upstream;   # sem trailing slash — preserva o path
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # Janelas de análise longas (EDA com meses de série) podem demorar
        # mais que o default de 60s. Fica em 120s como o gunicorn do Django.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
